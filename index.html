<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  background:radial-gradient(closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}

<body>
<div class="wrap" id="app"></div>
<div id="layer"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="say.js"></script>
<script>
const APP_VERSION='23';
const MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
const mealName=m=>((MEALS.find(x=>x[0]===m)||[0,m])[1]).toLowerCase();
// key, label, unit, colour, isCap (a limit to stay under, not a target to reach)
const MACROS=[['kcal','Calories','kcal','var(--kcal)',false],['net','Net carbs','g','var(--net)',true],['protein','Protein','g','var(--pro)',false],['fat','Fat','g','var(--fat)',false]];
const MKEYS=['kcal','fat','protein','net'];
const $=s=>document.querySelector(s);
const svg=(d,n)=>`<svg aria-hidden="true" width="${n||20}" height="${n||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={left:svg('<path d="M15 6l-6 6 6 6"/>'),right:svg('<path d="M9 6l6 6-6 6"/>'),x:svg('<path d="M6 6l12 12M18 6L6 18"/>',18),plus:svg('<path d="M12 5v14M5 12h14"/>'),
  gear:svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'),chev:svg('<path d="M6 9l6 6 6-6"/>',18),
  cam:svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),
  mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>')};
const MI={breakfast:svg('<path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 9V6M5.6 11.6 4.2 10.2M18.4 11.6l1.4-1.4"/>',22),
  lunch:svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',22),
  dinner:svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',22),
  snack:svg('<circle cx="12" cy="12" r="8.5"/><path d="M9 9h.01M14.5 8.5h.01M9.5 14.5h.01M15 13.5h.01M12 11.5h.01" stroke-width="3"/>',22)};
const tint=c=>`color-mix(in srgb,${c} var(--tint),transparent)`; // a ring's empty track: a faint wash of its own colour
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100, r0=n=>Math.round(n);
const fmt=n=>{n=r1(n);return (Math.abs(n)>=100?r0(n):n).toLocaleString('en-GB')};
const cut=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- config: one-time setup link  #setup=<base64 {url,key}> ----------
(function(){const m=/#setup=([A-Za-z0-9_\-]+)/.exec(location.hash);if(!m)return;try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const c=JSON.parse(atob(b));if(c.url&&c.key)ls.set('fl_cfg',c)}catch(e){}history.replaceState(null,'',location.pathname)})();
const CFG=ls.get('fl_cfg',null);
ls.del('fl_cache'); // v1 cache format, no longer used

// ---------- dates (the phone's own clock decides what "today" is) ----------
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dkey(new Date())}
function shift(k,n){const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nice(k){const [y,m,d]=k.split('-').map(Number);return DN[new Date(y,m-1,d).getDay()]+' '+d+' '+MN[m-1]}
// his times: 6-10 breakfast, 10-11:30 snack, 11:30-14:30 lunch, 14:30-17 snack, 17-19 dinner, 19-6 snack
function mealNow(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;return h>=6&&h<10?'breakfast':h>=11.5&&h<14.5?'lunch':h>=17&&h<19?'dinner':'snack'}

// ---------- state ----------
// S.follow: the screen is on "today" and should roll over to the new day at midnight
const S={date:today(),follow:true,data:null,loading:false,error:null,seq:0,badKey:false,update:false,pg:{}};
let Q=ls.get('fl_queue',[]);            // changes not yet confirmed by the sheet
const saveQ=()=>ls.set('fl_queue',Q);
let IDMAP=Q.length?ls.get('fl_idmap',{}):{}; // temp id of a just-created food -> its real id
if(!Q.length)ls.del('fl_idmap');
const realId=id=>IDMAP[id]||id;

const newCid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function apiErr(kind,msg){const e=new Error(msg);e.kind=kind;return e}
async function api(body,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||25000);
  let r;
  try{r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.key},body)),redirect:'follow',signal:ctl.signal})}
  catch(e){throw apiErr('offline','offline')}
  finally{clearTimeout(t)}
  let j;
  try{j=await r.json()}catch(e){throw apiErr('google','Google returned an error page')}
  if(j.error)throw apiErr('server',j.error);
  return j;
}

function cached(date){
  const base=ls.get('fl_last',null);if(!base)return null;
  const day=ls.get('fl_days',{})[date];
  return {date,goals:(day&&day.goals)||base.goals,foods:base.foods,entries:day?day.entries:[],sheetUrl:base.sheetUrl,partial:!day};
}
function remember(j){
  ls.set('fl_last',{goals:j.goals,foods:j.foods,sheetUrl:j.sheetUrl});
  const days=ls.get('fl_days',{});days[j.date]={goals:j.goals,entries:j.entries};
  Object.keys(days).sort().slice(0,-8).forEach(k=>delete days[k]);ls.set('fl_days',days);
}
async function load(quiet){
  if(!CFG)return;
  const seq=++S.seq,date=S.date,w=WRITES;
  if(!S.data||S.data.date!==date)S.data=cached(date);
  S.loading=true;if(!quiet)render();
  try{
    const j=await api({action:'state',date});
    if(seq!==S.seq)return;
    if(w!==WRITES){if(!flushing)load(true);return} // a change landed while this was on its way: it's out of date, ask again
    S.data=j;S.error=null;S.badKey=false;remember(j);
  }catch(e){
    if(seq!==S.seq)return;
    S.error=e.kind==='offline'?'offline':e.message;
    if(e.kind==='server'&&e.message==='Wrong key')S.badKey=true;
  }
  S.loading=false;render();
}

// ---------- one place that knows what each change does to a day's data ----------
function entryFrom(j,f){const k=j.qty/f.per;return{id:j.cid,date:j.date,meal:j.meal,foodId:f.id,food:f.name,qty:j.qty,unit:f.label,kcal:f.kcal*k,fat:f.fat*k,protein:f.protein*k,net:f.net*k}}
function rescale(e,qty){const k=qty/(e.qty||1);MKEYS.forEach(m=>e[m]*=k);e.qty=qty}
function applyJob(d,j,res){
  switch(j.action){
    case 'saveFood':{const f=(res&&res.food)||(j.tmpFood&&Object.assign({},j.tmpFood,{id:realId(j.tmpFood.id)}));if(!f)break;const tmp=j.tmpFood&&j.tmpFood.id;const i=d.foods.findIndex(x=>x.id===f.id||x.id===tmp);if(i>=0)d.foods[i]=f;else d.foods.push(f);break}
    case 'hideFood':{const id=realId(j.id);d.foods=d.foods.filter(f=>f.id!==id);break}
    case 'add':{
      if(j.date!==d.date||d.entries.some(e=>e.id===j.cid))break;
      let e=res&&res.entry;
      if(!e){const id=realId(j.foodId),f=d.foods.find(f=>f.id===id);if(!f)break;e=entryFrom(j,f);e.pending=true}
      d.entries.push(e);break}
    case 'edit':{const e=d.entries.find(e=>e.id===j.id);if(!e)break;if(j.meal)e.meal=j.meal;if(j.qty)rescale(e,j.qty);if(!res)e.pending=true;break}
    case 'del':d.entries=d.entries.filter(e=>e.id!==j.id);break;
    case 'saveGoals':if(j.date<=d.date)d.goals=(res&&res.goals)||{kcal:j.kcal,protein:j.protein,fat:j.fat,net:j.net};break;
  }
}
// what's on screen = what the sheet last told us + everything still waiting to send
function view(){
  const s=S.data;if(!s)return null;
  const d={date:s.date,goals:s.goals,foods:s.foods.slice(),entries:s.entries.map(e=>Object.assign({},e)),sheetUrl:s.sheetUrl};
  for(const j of Q)applyJob(d,j);
  return d;
}

// ---------- send queue ----------
const UNDO_MS=6000; // deletes wait this long before they're sent, so Undo is a true undo
const PERMANENT=/^(Food not found|Bad |Amount must|Food needs|Unknown action)/;
let flushing=false,inFlight=null,retryAt=0,WRITES=0; // WRITES counts changes the sheet has confirmed
function submit(job){if(job.meal&&FOLD[job.meal]&&(job.action==='add'||job.action==='edit')){FOLD[job.meal]=false;ls.set('fl_fold',FOLD)}job.qid=Date.now()+'-'+Math.random().toString(36).slice(2,8);Q.push(job);saveQ();render();flush(true);if(job.after)setTimeout(()=>flush(true),job.after-Date.now()+50)}
const unsend=job=>{if(inFlight===job.qid||!Q.some(j=>j.qid===job.qid))return false;Q=Q.filter(j=>j.qid!==job.qid);saveQ();render();return true};
async function flush(force){
  if(flushing||!CFG||S.badKey)return;
  if(!force&&Date.now()<retryAt)return;
  flushing=true;let changed=false;if(Q.some(x=>!x.held))render(); // the header dot shows it's saving
  try{
    for(;;){
      const now=Date.now(),j=Q.find(x=>!x.held&&!(x.after>now));if(!j)break;
      if(j.foodId)j.foodId=realId(j.foodId);
      if(j.food&&j.food.id)j.food.id=realId(j.food.id);
      const body=Object.assign({},j);delete body.qid;delete body.tmpFood;delete body.held;delete body.tries;delete body.after;
      if(j.action==='hideFood')body.id=realId(j.id);
      inFlight=j.qid;
      let res,err;try{res=await api(body)}catch(e){err=e}
      inFlight=null;
      const drop=()=>{Q=Q.filter(x=>x.qid!==j.qid);saveQ();changed=true;WRITES++};
      if(!err){
        if(j.action==='saveFood'&&j.tmpFood&&res.food&&j.tmpFood.id!==res.food.id){IDMAP[j.tmpFood.id]=res.food.id;ls.set('fl_idmap',IDMAP)}
        if(S.data)applyJob(S.data,j,res);
        drop();retryAt=0;continue;
      }
      if(err.kind!=='server'){retryAt=Date.now()+10000;break}       // no signal / Google hiccup: keep everything, try again later
      if(err.message==='Wrong key'){S.badKey=true;break}             // keep everything until the phone is re-linked
      if(/^Entry not found/.test(err.message)){drop();continue}      // editing something already deleted: nothing to do
      j.tries=(j.tries||0)+1;
      if(PERMANENT.test(err.message)||j.tries>=4){j.held=err.message;saveQ();continue} // park it and let the user decide
      saveQ();retryAt=Date.now()+15000;break;                        // e.g. the sheet was busy: retry
    }
  }finally{flushing=false;inFlight=null}
  if(changed&&S.data&&!S.data.partial)remember(S.data); // so a confirmed entry is still there if the next refresh fails
  if(changed)load(true);else render();
}
function retryHeld(){Q.forEach(j=>{delete j.held;delete j.tries});saveQ();flush(true)}
function discardHeld(){Q=Q.filter(j=>!j.held);saveQ();render();load(true)}

// ---------- keeping in step with the clock, the network and new versions ----------
function tick(){
  if(S.follow&&S.date!==today()&&!STACK.length){S.date=today();resetMealPages();load()}
  flush();
}
setInterval(tick,30000);
addEventListener('online',()=>flush(true));
addEventListener('storage',e=>{if(e.key==='fl_queue'&&!flushing){Q=ls.get('fl_queue',[]);render()}}); // another copy of the app changed the queue
let lastSeen=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lastSeen=Date.now();return}
  const away=Date.now()-lastSeen;
  if(!S.follow&&away>30*60000&&!STACK.length){S.follow=true}   // left on an old day for a while: open on today, like any diary app
  const rolled=S.follow&&S.date!==today();
  tick();
  if(!rolled&&away>60000)load(true);
  if(swReg)swReg.update().catch(()=>{});
});

// ---------- main screen ----------
const RING=2*Math.PI*31; // length of a ring's circle
// a ring's filled arc; past 100% a second lap in a darker shade, with a shadow, shows how far over (capped at 200%)
function arcs(c,R,sw,col,ratio){
  if(!(ratio>0))return '';
  const C=2*Math.PI*R,one=(len,st)=>`<circle cx="${c}" cy="${c}" r="${R}" fill="none" style="stroke:${st.col};${st.sh||''}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.max(0.1,len).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`;
  let h=one(C*Math.min(1,ratio),{col});
  if(ratio>1.005)h+=one(C*Math.min(1,ratio-1),{col:`color-mix(in srgb,${col} 62%,#000)`,sh:'filter:drop-shadow(0 0 1.5px rgba(0,0,0,.55))'});
  return h;
}
function totals(es){const t={kcal:0,fat:0,protein:0,net:0};es.forEach(e=>MKEYS.forEach(m=>t[m]+=e[m]));return t}
// the header dot: green = all in the sheet, grey = saving or checking, amber = waiting for signal, red = needs you
const SYNC={ok:['ok','Everything is saved'],busy:['busy','Saving'],wait:['wait','Waiting to send'],bad:['bad','Something needs a look']};
function syncState(){
  if(S.badKey||Q.some(j=>j.held)||(S.error&&S.error!=='offline'))return 'bad';
  if(S.error==='offline'||(Q.length&&retryAt>Date.now()))return 'wait';
  if(Q.length||S.loading||flushing)return 'busy';
  return 'ok';
}
function banners(){
  let h='';
  const now=Date.now(),held=Q.filter(j=>j.held),waiting=Q.filter(j=>!j.held&&!(j.after>now)).length;
  if(S.date!==today())h+=`<div class="banner info"><span>You're on ${nice(S.date)}, not today</span><button data-act="today">Go to today</button></div>`;
  if(S.update)h+=`<div class="banner info"><span>Update ready</span><button data-act="reload">Reload</button></div>`;
  if(S.badKey)h+=`<div class="banner err"><span>This phone is no longer linked to your sheet. Open the setup link again. Nothing you've logged is lost.</span></div>`;
  if(held.length)h+=`<div class="banner err"><span>${held.length} change${held.length>1?'s':''} couldn't be saved (${esc(held[0].held)})</span><button data-act="retryHeld">Retry</button><button data-act="discardHeld">Discard</button></div>`;
  if(waiting&&!S.badKey&&(S.error||!navigator.onLine||retryAt))h+=`<div class="banner"><span>${waiting} change${waiting>1?'s':''} waiting to send</span><button data-act="sendNow">Send now</button></div>`;
  else if(S.error==='offline'&&!waiting)h+=`<div class="banner"><span>${!S.data?'No signal. Connect once so your foods can load.':S.data.partial?"No signal, and this day isn't saved on this phone yet":'No signal, showing the last saved copy'}</span><button data-act="reloadData">Retry</button></div>`;
  if(S.error&&S.error!=='offline'&&!S.badKey)h+=`<div class="banner err"><span>Couldn't read the sheet: ${esc(S.error)}</span><button data-act="reloadData">Try again</button></div>`;
  return h;
}
function render(){
  if((SW.on&&Date.now()-SW.since<5000)||SW.t){SW.pending=true;return} // a stuck touch never blocks for long
  const app=$('#app');
  if(!CFG){app.innerHTML='<div class="setup"><h2>Food Log</h2><p>Open the setup link once to connect this phone to your sheet.</p></div>';return}
  const isToday=S.date===today();
  const v=view(),ready=!!v,first=!v||(S.data.partial&&S.loading); // first = nothing trustworthy for this day yet
  const d=v||{goals:{},entries:[]},g=d.goals||{},t=totals(d.entries),unloaded=ready&&S.data.partial&&!S.loading;
  let h=`<div class="band"></div><header><button class="iconbtn" aria-label="Previous day" data-act="day" data-n="-1">${IC.left}</button><h1><button class="hbtn" data-act="refresh" aria-label="Refresh. ${SYNC[syncState()][1]}">${isToday?'Today':nice(S.date)}<span class="sub"><i class="sync ${syncState()}" aria-hidden="true"></i>${isToday?nice(S.date):(S.date===shift(today(),-1)?'Yesterday':'')}</span></button></h1><button class="iconbtn" aria-label="Next day" data-act="day" data-n="1" ${isToday?'disabled':''}>${IC.right}</button><button class="iconbtn" aria-label="Goals and settings" data-act="goals" ${ready?'':'disabled'}>${IC.gear}</button></header>`;
  h+=banners();
  h+='<div class="card mac"><div class="pages" data-sw="top"><div class="pg rings" aria-label="Goals">';
  for(const [k,label,u,col,cap] of MACROS){
    const goal=g[k]||0,val=t[k],frac=goal?Math.min(1,val/goal):0,over=goal&&val>goal+0.05,un=k==='kcal'?'':' g';
    const sub=!ready?'&nbsp;':!goal?'No goal':over?fmt(val-goal)+un+' over':fmt(goal-val)+un+' left';
    const arc=ready&&goal?arcs(38,31,8,over&&cap?'var(--bad)':col,val/goal):'';
    h+=`<button class="ring" data-act="ring" data-k="${k}" ${ready?'':'disabled'}><div class="dial"><svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="${label}: ${ready?fmt(val):'loading'} of ${fmt(goal)} ${u}"><circle cx="38" cy="38" r="31" fill="none" style="stroke:${tint(col)}" stroke-width="8"/>${arc}</svg><b>${ready?fmt(val):'–'}</b></div><div class="rl">${label}</div><div class="rs ${over&&cap?'bad':''}">${sub}</div></button>`;
  }
  h+=`</div><div class="pg" aria-label="Goals chart">${chart(t,g,ready,false)}</div></div>${dots('top',2)}</div>`;
  for(const [m,label] of MEALS){
    const es=d.entries.filter(e=>e.meal===m),mt=totals(es);
    const tot=es.length?kc(mt.kcal)+' kcal, '+fmt(mt.net)+' g net':first?'Loading…':unloaded?'Not loaded':'Nothing yet';
    const folded=es.length&&FOLD[m];
    h+=`<div class="card meal ${folded?'folded':''}"><div class="mh"><button class="mtog" data-act="fold" data-meal="${m}" ${es.length?`aria-expanded="${!folded}"`:'disabled'}><span class="mi" style="background:var(--m-${m})">${MI[m]}</span><h2>${label}<span class="tot">${tot}</span></h2>${es.length?`<span class="chev">${IC.chev}</span>`:''}</button><button class="plus" aria-label="Add to ${label.toLowerCase()}" data-act="add" data-meal="${m}" ${ready?'':'disabled'}>${IC.plus}</button></div>`;
    if(!es.length)delete S.pg['m:'+m];
    if(es.length&&!folded){
      // swipe the card: what's in it, then the rings chart for this meal
      h+=`<div class="pages" data-sw="m:${m}"><div class="pg" aria-label="${label} foods">`;
      for(const gr of groups(es)){
        const t=totals(gr.es),one=gr.es.length===1,e=gr.es[0],qty=gr.es.reduce((a,x)=>a+x.qty,0),f=foodOf(e.foodId);
        h+=`<div class="ent ${gr.es.some(x=>x.pending)?'pending':''}"><button class="row" data-act="${one?'entry':'group'}" ${one?`data-id="${esc(e.id)}"`:`data-meal="${m}" data-fid="${esc(gr.key)}"`}><div class="n"><div>${esc(e.food)}</div><small>${fmt(qty)} ${esc(e.unit)}${one?'':` <span class="times">×${gr.es.length}</span>`}</small></div><div class="m"><b>${kc(t.kcal)}</b> kcal<br>${fmt(t.net)} g net</div></button>${f?`<button class="again" data-act="again" data-meal="${m}" data-fid="${esc(f.id)}" aria-label="Log ${fmt(usualQty(f))} ${esc(f.label)} more ${esc(f.name)}">${IC.plus}</button>`:'<span class="again"></span>'}</div>`;
      }
      h+=`</div><div class="pg" aria-label="${label} chart">${chart(mt,g,true,true)}</div></div>${dots('m:'+m,2)}`;
    }
    h+='</div>';
  }
  h+=`<button class="fab" data-act="say" aria-label="Say or type what you ate" ${ready?'':'disabled'}>${IC.mic}</button>`;app.innerHTML=h;
  swipers();
}
// the same food logged more than once in a meal shows as one row with its total (the sheet still has a row per portion)
const gkey=e=>(e.foodId?realId(e.foodId):'n:'+e.food)+'|'+e.unit; // a food logged offline before its id came back still groups with the rest
function groups(es){const by=new Map();for(const e of es){const k=gkey(e);if(!by.has(k))by.set(k,{key:k,es:[]});by.get(k).es.push(e)}return [...by.values()]}
const foodOf=id=>{const r=realId(id);return view().foods.find(f=>f.id===r)};
const kc=n=>r0(n).toLocaleString('en-GB');
const FOLD=ls.get('fl_fold',{});
function fold(m){FOLD[m]=!FOLD[m];ls.set('fl_fold',FOLD);render()}
// one tap on a row's +: the usual amount of that food again, same meal
let lastAgain=[null,0];
function again(d){
  const k=d.meal+d.fid;if(lastAgain[0]===k&&Date.now()-lastAgain[1]<600)return; // a double tap shouldn't log it twice
  lastAgain=[k,Date.now()];
  const f=foodOf(d.fid);if(!f)return;const q=usualQty(f),cid=newCid();
  submit({action:'add',cid,date:S.date,meal:d.meal,foodId:f.id,qty:q});
  if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  toast('Added '+fmt(q)+' '+f.label+' · '+cut(f.name,20),'Undo',()=>undoAdd(cid));
  if(STACK[STACK.length-1]===sheetGroup)sheetGroup();
}
// every portion of one food in one meal
let GP=null;
function sheetGroup(){
  const es=view().entries.filter(e=>e.meal===GP.meal&&gkey(e)===GP.fid);
  if(!es.length){sheetEl.innerHTML=head('Nothing left')+'<div class="sh-body"><div class="empty">Those portions have all been removed.</div></div>';return}
  const t=totals(es),qty=es.reduce((a,x)=>a+x.qty,0),f=foodOf(es[0].foodId);
  sheetEl.innerHTML=head(esc(es[0].food))+`<div class="sh-body"><div class="gsum">${fmt(qty)} ${esc(es[0].unit)} at ${mealName(GP.meal)} in ${es.length} portions · ${kc(t.kcal)} kcal · ${fmt(t.net)} g net</div>

const CH=[['fat','Fat',53,'var(--fat)',false],['protein','Protein',40,'var(--pro)',false],['net','Net carbs',27,'var(--net)',true]];
function chart(t,g,ready,meal){

    const C=2*Math.PI*R,goal=g[k]||0,f=goal?Math.min(1,t[k]/goal):0,over=goal&&t[k]>goal+0.05,c=over&&cap&&!meal?'var(--bad)':col;
    svg+=`<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${tint(col)}" stroke-width="11"/>`;
    if(ready&&goal)svg+=arcs(60,R,11,c,t[k]/goal);
  }
  const gk=g.kcal||0;
  let h=`<div class="gc"><svg class="gcw" viewBox="0 0 120 120" aria-hidden="true">${svg}</svg><div class="gside"><div class="gk"><b>${ready?fmt(t.kcal):'–'}</b> ${meal?`kcal<small>${gk?r0(t.kcal/gk*100)+"% of today's calories":''}</small>`:`<span>/ ${gk?fmt(gk):'–'} kcal</span><small>${!ready||!gk?'&nbsp;':t.kcal>gk?fmt(t.kcal-gk)+' over':fmt(gk-t.kcal)+' left'}</small>`}</div>`;
  for(const [k,label,,col,cap] of [CH[2],CH[1],CH[0]]){
    const goal=g[k]||0,over=goal&&t[k]>goal+0.05;
    const side=!ready||!goal?'':meal?r0(t[k]/goal*100)+'%':over?fmt(t[k]-goal)+' g over':fmt(goal-t[k])+' g left';
    const tag=meal?'div':'button';

  }

}

function sheetSay(){

  const t=$('#saytxt');t.addEventListener('input',()=>{SY.text=t.value});t.addEventListener('focus',micStop);

function micShow(){const b=$('#bigmic');if(!b)return;b.classList.toggle('on',!!REC);$('#micl').textContent=REC?'Listening… tap to stop':'Tap to speak'}
function micStart(){
  if(!SR||REC)return;
  const r=new SR(),base=SY.text?SY.text.replace(/\s*$/,', '):'';let heard='',done=false;
  r.lang='en-GB';r.interimResults=true;r.continuous=false;
  r.onresult=e=>{heard=[...e.results].map(x=>x[0].transcript).join(' ');SY.text=base+heard;const t=$('#saytxt');if(t)t.value=SY.text;done=[...e.results].every(x=>x.isFinal)};
  r.onerror=e=>{const m=$('#saymsg');if(m)m.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'The microphone is blocked for this app. Allow it in Chrome\'s site settings, or type instead.':e.error==='network'?'The mic needs signal. You can type instead.':e.error==='no-speech'?'Didn\'t hear anything. Tap to try again.':'The mic stopped. Tap to try again, or type.'};
  r.onend=()=>{const manual=r._manual;REC=null;micShow();if(heard&&!manual&&STACK[STACK.length-1]===sheetSay)sayNext()};
  try{r.start();REC=r}catch(e){REC=null}
  micShow();
}
function micStop(){if(REC){const r=REC;r._manual=true;REC=null;try{r.stop()}catch(e){}micShow()}}
function sayNext(){
  micStop();const txt=(SY.text||'').trim();if(!txt)return toast('Say or type what you had');

const syUnit=f=>f.unit==='serving'?f.label:f.unit;
const syMac=r=>{if(!r.food||!(r.qty>0))return null;const k=r.qty/r.food.per;return{kcal:r.food.kcal*k,net:r.food.net*k,protein:r.food.protein*k,fat:r.food.fat*k}};

function sayRefresh(){

let SP=null; // which row is being changed

function sayLog(){

// ----- label scanner (free OCR on the phone; the reader is downloaded on first use, then kept) -----
let SC=null;
// camera: opens the camera straight away, and the shot comes to the app without going into his photos
const camIn=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'});camIn.setAttribute('capture','environment');
const fileIn=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'});
const onPhoto=async fileIn=>{const file=fileIn.files[0];fileIn.value='';if(!file)return;
  let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){return toast("Couldn't open that photo")}
  SC={bmp,box:{x:.08,y:.08,w:.84,h:.84},busy:false};STACK[STACK.length-1]===sheetScan?navReplace(sheetScan):nav(sheetScan)};
camIn.addEventListener('change',()=>onPhoto(camIn));fileIn.addEventListener('change',()=>onPhoto(fileIn));
function startScan(pick){FF.draft=ffDraft();(pick?fileIn:camIn).click()}
function loadReader(){
  if(window.FLLabel&&window.Tesseract)return Promise.resolve();
  const add=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s)});
  return add('ocr/tesseract.min.js').then(()=>add('ocr/label.js'));
}
function sheetScan(){
  if(!SC)return back();
  sheetEl.innerHTML=head('Scan label')+`<div class="sh-body">
  <div class="hint" style="margin:0 0 8px">Drag the corners so the box covers just the nutrition table, including its "per 100g" heading.</div>
  <div class="crop nodrag" id="crop"><canvas id="cropcv"></canvas><div class="cbox" id="cbox"></div>${['nw','ne','sw','se'].map(c=>`<div class="hd" data-c="${c}"></div>`).join('')}</div>
  <div class="scanmsg" id="scanmsg" role="status"></div>
  <button class="primary" data-act="scanRead" id="scanbtn">Read label</button>
  <div class="links"><button class="link" data-act="scanRetake">Retake</button><button class="link" data-act="scanPickAgain">Pick a photo</button></div></div>`;
  const b=SC.bmp,el=$('#crop'),maxH=Math.max(260,innerHeight*.56),avail=el.parentNode.clientWidth-28;
  const k=Math.min(avail/b.width,maxH/b.height),W=Math.round(b.width*k),H=Math.round(b.height*k);
  el.style.width=W+'px';el.style.height=H+'px';
  const cv=$('#cropcv'),dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.getContext('2d').drawImage(b,0,0,cv.width,cv.height);
  const box=$('#cbox'),hs=[...el.querySelectorAll('.hd')];
  const draw=()=>{const r=SC.box;Object.assign(box.style,{left:r.x*W+'px',top:r.y*H+'px',width:r.w*W+'px',height:r.h*H+'px'});
    hs.forEach(h=>{const c=h.dataset.c;h.style.left=(c[1]==='w'?r.x:r.x+r.w)*W+'px';h.style.top=(c[0]==='n'?r.y:r.y+r.h)*H+'px'})};
  draw();
  let drag=null;const MIN=.06,cl=(v,a,z)=>Math.max(a,Math.min(z,v));
  el.addEventListener('pointerdown',e=>{if(SC.busy)return;const t=e.target.closest('.hd,.cbox');if(!t)return;e.preventDefault();el.setPointerCapture(e.pointerId);
    drag={c:t.dataset.c||'move',x:e.clientX,y:e.clientY,r:Object.assign({},SC.box)}});
  el.addEventListener('pointermove',e=>{if(!drag)return;const dx=(e.clientX-drag.x)/W,dy=(e.clientY-drag.y)/H,o=drag.r,r=SC.box;
    if(drag.c==='move'){r.x=cl(o.x+dx,0,1-o.w);r.y=cl(o.y+dy,0,1-o.h)}
    else{let x0=o.x,y0=o.y,x1=o.x+o.w,y1=o.y+o.h;
      if(drag.c[1]==='w')x0=cl(x0+dx,0,x1-MIN);else x1=cl(x1+dx,x0+MIN,1);
      if(drag.c[0]==='n')y0=cl(y0+dy,0,y1-MIN);else y1=cl(y1+dy,y0+MIN,1);
      Object.assign(r,{x:x0,y:y0,w:x1-x0,h:y1-y0})}
    draw()});
  const end=()=>{drag=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
async function scanRead(){
  if(!SC||SC.busy)return;SC.busy=true;const btn=$('#scanbtn'),msg=t=>{const m=$('#scanmsg');if(m)m.textContent=t};btn.disabled=true;
  const mine=SC;
  try{
    msg(window.Tesseract?'Reading the label…':'Getting the reader ready… (the first time downloads about 7 MB)');
    await loadReader();
    // cut out the box at full photo resolution, sized so the text is big enough for the reader
    const b=SC.bmp,r=SC.box,sx=r.x*b.width,sy=r.y*b.height,sw=r.w*b.width,sh=r.h*b.height;
    let k=Math.min(4,1800/sw);if(sw*k>2400)k=2400/sw;if(sw*k*sh*k>7e6)k=Math.sqrt(7e6/(sw*sh));
    const cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
    const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingQuality='high';ctx.drawImage(b,sx,sy,sw,sh,0,0,cv.width,cv.height);
    const res=await FLLabel.read(cv,msg);
    if(SC!==mine||STACK[STACK.length-1]!==sheetScan)return; // he backed out while it was reading
    applyScan(res);SC=null;back();
  }catch(e){
    if(SC===mine){SC.busy=false;btn.disabled=false;msg(e&&e.message==='load'?"Couldn't download the reader. It needs signal the first time.":"Couldn't read that. Try another photo, closer and without glare.")}
  }
}
function applyScan(res){
  const d=FF.draft||{name:'',unit:'g',label:'serving'},v=res.vals,f=res.flags;
  const flags={kcal:f.kcal,fat:f.fat,protein:f.protein,net:f.carbs==='ok'&&(res.region!=='us'||f.fibre==='ok')?'ok':f.carbs==='missing'?'missing':'unsure',def:res.defQty==null?'ok':res.servFlag};
  FF.draft=Object.assign({},d,{unit:res.unit,label:res.unit==='serving'?(res.label||'serving'):d.label,kcal:v.kcal,fat:v.fat,protein:v.protein,net:v.net,defQty:res.defQty??d.defQty});
  const nWarn=['kcal','fat','protein','net','def'].filter(k=>flags[k]!=='ok').length;
  FF.scan={res,region:res.region,flags,maths:res.maths,nWarn};
}
function ffUnit(u){FF.unit=u;sheetEl.querySelectorAll('[data-u]').forEach(c=>c.classList.toggle('on',c.dataset.u===u));$('#ff_lab').style.display=u==='serving'?'block':'none'}
function ffSave(){
  const val=k=>{const s=$('#ff_'+k).value.trim().replace(',','.');return s===''?null:Number(s)};
  const name=$('#ff_name').value.trim(),unit=FF.unit;

  if(FF.onSaved){const cb=FF.onSaved;FF.onSaved=null;toast('Food saved');cb(tmp);back();return}
  if(id){toast('Food updated');back()}
  else{toast('Food saved');AM={fid:tmp.id,eid:null,meal:AD.meal,qty:tmp.defQty,fresh:true};navReplace(sheetAmount)}

function hideFood(){
  const {f}=amParts();if(!f)return closeAll();
  const job={action:'hideFood',id:f.id,after:Date.now()+UNDO_MS};submit(job);back();

// ----- tap a ring: where today's total came from -----
let RG={k:'net'};
function sheetRing(){
  const v=view(),[k,label,u,col,cap]=MACROS.find(m=>m[0]===RG.k),goal=(v.goals||{})[k]||0,tot=totals(v.entries)[k],un=k==='kcal'?' kcal':' g';
  const by={};v.entries.forEach(e=>{const key=e.food+'|'+e.unit,x=by[key]||(by[key]={name:e.food,val:0,n:0,qty:0,unit:e.unit});x.val+=e[k];x.n++;x.qty+=e.qty});
  const rows=Object.values(by).filter(x=>x.val>=0.05).sort((a,b)=>b.val-a.val),top=rows.length?rows[0].val:1,over=goal&&tot>goal+0.05;
  const left=!goal?'no goal set':over?fmt(tot-goal)+un+' over':fmt(goal-tot)+un+' left';
  sheetEl.innerHTML=head(label+(S.date===today()?' today':' · '+nice(S.date)))+`<div class="sh-body">
  <div class="sum"><b>${fmt(tot)}</b> of ${goal?fmt(goal):'–'}${un} · <span class="${over&&cap?'danger':''}">${left}</span></div>
  <div class="chips four">${MACROS.map(m=>`<button class="chip ${m[0]===k?'on':''}" data-act="ringK" data-k="${m[0]}">${m[1]}</button>`).join('')}</div>
  ${rows.length?rows.map(x=>`<div class="src"><div class="row"><div class="n"><div>${esc(x.name)}</div><small>${fmt(x.qty)} ${esc(x.unit)}${x.n>1?' · '+x.n+' entries':''}</small></div><div class="v"><b>${fmt(x.val)}</b>${un}<br>${tot?r0(x.val/tot*100):0}%</div></div><div class="share"><i style="width:${x.val/top*100}%;background:${col}"></i></div></div>`).join('')
    :`<div class="empty" style="padding:16px 0">${v.entries.length?'Nothing you\'ve logged has any.':'Nothing logged yet.'}</div>`}
  </div>`;
}

  const v=view(),g=v.goals||{};
  sheetEl.innerHTML=head('Goals and settings')+`<div class="sh-body form">
  <div class="grid2"><div><label for="g_kcal">Calories (kcal)</label><input class="inp" id="g_kcal" inputmode="decimal" value="${g.kcal??''}"></div><div><label for="g_net">Net carbs (g)</label><input class="inp" id="g_net" inputmode="decimal" value="${g.net??''}"></div>

  <div class="hint">Changing protein, net carbs or fat updates calories for you (4 kcal per g of protein or carbs, 9 per g of fat). You can still type calories yourself.</div>
  <div class="hint">New goals apply from today on; past days keep the goals they had.</div>
  <div style="height:14px"></div><button class="primary" data-act="saveGoals">Save goals</button>
  <h4 class="seth">App colours</h4>
  <div class="swatches" role="radiogroup" aria-label="Colour">${BANDS.map(([b,l,c])=>`<button class="sw" role="radio" aria-checked="${TH.band===b}" aria-label="${l}" data-act="band" data-b="${b}" style="background:${c}"></button>`).join('')}<button class="sw swc" role="radio" aria-checked="${TH.band==='custom'}" aria-label="Any colour" data-act="band" data-b="custom"></button></div>
  <div id="cwp"></div>
  <div class="chips" role="radiogroup" aria-label="Light or dark">${[['light','Light'],['dark','Dark'],['auto','Match phone']].map(([m,l])=>`<button class="chip ${TH.mode===m?'on':''}" role="radio" aria-checked="${TH.mode===m}" data-act="mode" data-m="${m}">${l}</button>`).join('')}</div>
  ${v.sheetUrl?`<a class="secondary" href="${esc(v.sheetUrl)}" target="_blank" rel="noopener">Open the sheet (export from there)</a>`:''}
  <div class="hint" style="text-align:center;margin-top:14px">Food Log v${APP_VERSION}</div></div>`;
  if(TH.band==='custom')wheel($('#cwp'));
  // calories move by what each macro change is worth, so a goal set by hand keeps its offset
  const num=k=>{const s=$('#g_'+k).value.trim().replace(',','.');return s===''?NaN:Number(s)};
  const KC={protein:4,net:4,fat:9},last={};
  Object.keys(KC).forEach(k=>{last[k]=num(k);$('#g_'+k).addEventListener('input',()=>{
    const now=num(k),kc=num('kcal');
    if(isFinite(now)&&isFinite(last[k])&&isFinite(kc))$('#g_kcal').value=String(Math.round(kc+(now-last[k])*KC[k]));
    if(isFinite(now))last[k]=now;
  })});

function saveGoals(){
  const n=k=>{const s=$('#g_'+k).value.trim().replace(',','.');return s===''?NaN:Number(s)};
  const job={action:'saveGoals',date:today(),kcal:n('kcal'),protein:n('protein'),fat:n('fat'),net:n('net')};
  if(MKEYS.some(k=>!(job[k]>=0)))return toast('Fill in all four');
  closeAll();submit(job);toast('Goals saved');
}

// ---------- colour theme (stored on this phone only) ----------
const BANDS=[['ink','Ink','#17181F'],['blue','Blue','#2457F5'],['teal','Teal','#0B7F6F'],['violet','Violet','#6D4AFF'],['orange','Orange','#E2581A']];
let TH=Object.assign({band:'ink',mode:'light'},ls.get('fl_theme',{}));
const okHex=h=>/^#[0-9a-f]{6}$/i.test(h||'');
if(!(BANDS.some(b=>b[0]===TH.band)||(TH.band==='custom'&&okHex(TH.custom))))TH.band='ink';
if(!['light','dark','auto'].includes(TH.mode))TH.mode='light';
const darkQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const d=document.documentElement;d.dataset.band=TH.band;d.dataset.mode=TH.mode==='auto'?(darkQ.matches?'dark':'light'):TH.mode;
  const v=TH.band==='custom'?flVars(TH.custom,d.dataset.mode==='dark'):{};
  ['--band','--onband','--bandbtn','--acc','--onacc'].forEach(k=>v[k]?d.style.setProperty(k,v[k]):d.style.removeProperty(k));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(d).getPropertyValue('--band').trim()||'#17181F'; // phone status bar matches the header
}
function setTheme(ch){
  if(ch.band==='custom'&&!okHex(TH.custom)&&!ch.custom)ch.custom=(BANDS.find(b=>b[0]===TH.band)||BANDS[1])[2]; // start the wheel on the colour you had
  Object.assign(TH,ch);ls.set('fl_theme',TH);applyTheme();
  sheetEl.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-checked',b.dataset.b===TH.band));
  const w=$('#cwp');if(w){if(TH.band==='custom'){if(!w.childElementCount)wheel(w)}else w.innerHTML=''}
  sheetEl.querySelectorAll('[data-act=mode]').forEach(b=>{const on=b.dataset.m===TH.mode;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
}
darkQ.addEventListener&&darkQ.addEventListener('change',()=>{if(TH.mode==='auto')applyTheme()});
// ----- colour wheel: round = which colour and how strong, slider = how dark -----
const hsv2hex=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
function hex2hsv(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:mx?d/mx:0,v:mx}}
function wheel(box){
  const c=hex2hsv(TH.custom);
  box.innerHTML=`<div class="cw nodrag" id="cw" role="slider" aria-label="Colour wheel" tabindex="0"><div class="cwd" id="cwd"></div><i class="knob" id="knob"></i></div>
  <div class="crow nodrag"><input type="range" id="cv" min="15" max="100" aria-label="How dark"><span class="chex" id="chex"></span></div>`;
  const cw=$('#cw'),cv=$('#cv');cv.value=Math.round(c.v*100);
  let raf=0;
  const show=save=>{
    const R=cw.clientWidth/2,a=c.h*Math.PI/180;
    $('#knob').style.transform=`translate(${(R+Math.sin(a)*c.s*R).toFixed(1)}px,${(R-Math.cos(a)*c.s*R).toFixed(1)}px)`;
    $('#cwd').style.opacity=(1-c.v).toFixed(2);
    const hex=hsv2hex(c.h,c.s,c.v);$('#knob').style.background=hex;$('#chex').textContent=hex;
    cv.style.background=`linear-gradient(to right,#000,${hsv2hex(c.h,c.s,1)})`;cw.setAttribute('aria-valuetext',hex);
    if(save){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>setTheme({band:'custom',custom:hex}))}
  };
  const at=e=>{const r=cw.getBoundingClientRect(),R=r.width/2,dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;
    c.h=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;c.s=Math.min(1,Math.hypot(dx,dy)/R);if(c.v<.15)c.v=.6,cv.value=60;show(true)};
  let down=false;
  cw.addEventListener('pointerdown',e=>{down=true;cw.setPointerCapture(e.pointerId);at(e)});
  cw.addEventListener('pointermove',e=>{if(down)at(e)});
  ['pointerup','pointercancel'].forEach(t=>cw.addEventListener(t,()=>down=false));
  cw.addEventListener('keydown',e=>{const k={ArrowLeft:-10,ArrowRight:10}[e.key];if(k){e.preventDefault();c.h=(c.h+k+360)%360;if(c.s<.2)c.s=.8;show(true)}});
  cv.addEventListener('input',()=>{c.v=cv.value/100;show(true)});
  show(false);
}
applyTheme();

// ---------- every tap goes through here ----------
const ACT={
  day:d=>go(Number(d.n)),today:goToday,goals:()=>nav(sheetGoals),add:d=>openAdd(d.meal),entry:d=>openEntry(d.id),
  ring:d=>{RG={k:d.k};nav(sheetRing)},fold:d=>fold(d.meal),again,group:d=>{GP={meal:d.meal,fid:d.fid};nav(sheetGroup)},ringK:d=>{RG.k=d.k;sheetRing()},
  close:back,done:closeAll,quick:d=>quick(d.id),newFood:()=>openFoodForm(null,AD.q),pick:d=>pick(d.id),
meal:d=>{AM.meal=d.m;sheetEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m))},
  amSave,amDelete,editFood:()=>openFoodForm(realId(AM.fid)),hideFood,
  ffUnit:d=>ffUnit(d.u),ffSave,say:openSay,refresh:()=>{load();flush(true)},mic:()=>REC?micStop():micStart(),sayNext,sayLog,
  sayMeal:d=>{SY.meal=d.m;sheetEl.querySelectorAll('[data-act=sayMeal]').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m));sayRefresh()},
  sayDel:d=>{SY.rows.splice(Number(d.i),1);if(!SY.rows.length)return back();sheetSayCheck()},
  sayPick:d=>{SP=Number(d.i);nav(sheetSayPick)},sayChoose:d=>sayChoose(d.id),
  sayNew:()=>{const r=SY.rows[SP];openFoodForm(null,$('#spq').value.trim()||r.phrase,tmp=>{r.food=tmp;r.sure=true;FLSay.amount(r);SY.skipPick=true})},scan:()=>startScan(false),scanPick:()=>startScan(true),ffRegion:d=>ffRegion(d.r),scanRead,scanRetake:()=>camIn.click(),scanPickAgain:()=>fileIn.click(),saveGoals,band:d=>setTheme({band:d.b}),mode:d=>setTheme({mode:d.m}),
  retryHeld,discardHeld,sendNow:()=>flush(true),reloadData:()=>load(),reload:()=>location.reload(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el)});

// ---------- toast ----------
let toastTimer;
function toast(msg,act,fn){const t=$('#toast');clearTimeout(toastTimer);t.innerHTML=esc(msg)+(act?` <button id="tact">${esc(act)}</button>`:'');t.style.display='flex';if(act)$('#tact').onclick=()=>{t.style.display='none';fn()};toastTimer=setTimeout(()=>t.style.display='none',act?6000:2500)}

// ---------- start ----------
let swReg=null;
render();
if(CFG){load();flush(true)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{}); // ask Chrome not to clear unsent entries when storage is tight
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){S.update=true;render()}});
  navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
}
</script>
