<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<title>Food Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--card:#141922;--card2:#1B212C;--line:#262E3B;--text:#E8ECF2;--dim:#A3AAB6;--faint:#858C97;--acc:#00E0FF;--ok:#3DDC97;--warn:#FFB547;--bad:#FF5C6C;
--kcal:#00E0FF;--net:#FFB547;--pro:#7C9CFF;--fat:#3DDC97}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px;padding:6px 0 12px}
header h1{font-size:20px;margin:0;flex:1}
header .sub{display:block;font-size:13px;color:var(--dim);font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:18px;color:var(--dim)}
.iconbtn:disabled{opacity:.35}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.bars{display:grid;gap:12px}
.bar .top{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-bottom:5px}
.bar .top b{color:var(--text);font-weight:600;font-size:15px}
.track{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .3s}
.left{font-size:12px;color:var(--faint);margin-top:3px}
.over .left{color:var(--bad)}
.meal h2{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
.meal h2 .tot{margin-left:auto;font-size:12px;color:var(--dim);font-weight:500}
.ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.ent .n{flex:1;min-width:0}
.ent .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .n small{color:var(--faint)}
.ent .m{text-align:right;font-size:13px;color:var(--dim);white-space:nowrap}
.ent .m b{color:var(--text);font-weight:600}
.empty{color:var(--faint);font-size:13px;padding:6px 0}
.addbtn{margin-top:8px;width:100%;padding:10px;border-radius:12px;background:var(--card2);color:var(--acc);font-weight:600}
.pending{opacity:.6}
.banner{background:#2A2210;color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.err{background:#2A1216;color:var(--bad)}
.banner button{margin-left:auto;color:inherit;font-weight:600;text-decoration:underline}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;z-index:11;background:var(--bg);border-radius:20px 20px 0 0;display:none;flex-direction:column;max-width:560px;margin:0 auto;border-top:1px solid var(--line)}
.open .scrim,.open .sheet{display:flex}
.open .scrim{display:block}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
.sh-head h3{margin:0;font-size:17px;flex:1}
.sh-body{overflow:auto;padding:0 14px calc(18px + env(safe-area-inset-bottom))}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.search:focus,.inp:focus{border-color:var(--acc)}
.frow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.frow .n{flex:1;min-width:0}
.frow small{color:var(--faint);display:block}
.frow .k{color:var(--dim);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;padding:10px 0;border-radius:12px;background:var(--card);color:var(--dim);font-weight:600}
.chip.on{background:var(--acc);color:#001318}
.qty{display:flex;align-items:center;gap:8px;margin:12px 0}
.qty input{flex:1;font-size:28px;font-weight:600;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;min-width:0}
.qty span{color:var(--dim);font-size:16px;min-width:40px}
.step{width:48px;height:56px;border-radius:12px;background:var(--card);font-size:22px;color:var(--dim)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.macros div{background:var(--card);border-radius:12px;padding:8px;text-align:center}
.macros b{display:block;font-size:17px}
.macros small{color:var(--faint);font-size:11px}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--acc);color:#001318;font-weight:700;font-size:16px}
.primary:disabled{opacity:.4}
.secondary{width:100%;padding:12px;border-radius:14px;background:var(--card);color:var(--text);font-weight:600;margin-top:8px}
.danger{color:var(--bad)}
.link{color:var(--acc);font-weight:600;padding:8px 0}
.form label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#E8ECF2;color:#0B0E13;padding:10px 14px;border-radius:12px;font-weight:600;font-size:14px;z-index:20;display:none;gap:12px;align-items:center;max-width:90vw}
.toast button{color:#007A8C;font-weight:700}
.sub2{font-size:12px;color:var(--faint);margin:4px 0 0}
.setup{padding:40px 10px;text-align:center;color:var(--dim)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const APP_VERSION='1';
const MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner']];
const MACROS=[['kcal','Calories','kcal','var(--kcal)'],['net','Net carbs','g','var(--net)'],['protein','Protein','g','var(--pro)'],['fat','Fat','g','var(--fat)']];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10, r0=n=>Math.round(n);
const fmtG=n=>{n=r1(n);return (Math.abs(n)>=100?r0(n):n).toLocaleString('en-GB')};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- config (one-time setup link: #setup=<base64 {url,key}>) ----------
(function(){const m=/#setup=([A-Za-z0-9_\-]+)/.exec(location.hash);if(!m)return;try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const c=JSON.parse(atob(b));if(c.url&&c.key){ls.set('fl_cfg',c)}}catch(e){}history.replaceState(null,'',location.pathname)})();
const CFG=ls.get('fl_cfg',null);

// ---------- dates ----------
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dkey(new Date())}
function shift(k,n){const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nice(k){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);return DN[dt.getDay()]+' '+d+' '+MN[m-1]}
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<11?'breakfast':h<16.5?'lunch':'dinner'}

// ---------- state ----------
const S={date:today(),data:null,loading:false,error:null,seq:0};
let Q=ls.get('fl_queue',[]); // pending writes
const saveQ=()=>ls.set('fl_queue',Q);
const cache=()=>ls.get('fl_cache',{});

async function api(body){
  const r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.key},body)),redirect:'follow'});
  const j=await r.json();
  if(j.error)throw Object.assign(new Error(j.error),{server:true});
  return j;
}

async function load(quiet){
  const seq=++S.seq,date=S.date;
  if(!quiet){const c=cache()[date];if(c){S.data=c}else{S.data=null;const any=ls.get('fl_last',null);if(any)S.data={goals:any.goals,foods:any.foods,entries:[],sheetUrl:any.sheetUrl,stale:true}}S.loading=true;render()}
  try{
    const j=await api({action:'state',date});
    if(seq!==S.seq)return;
    S.data=j;S.error=null;
    const c=cache();c[date]=j;Object.keys(c).sort().slice(0,-8).forEach(k=>delete c[k]);ls.set('fl_cache',c);
    ls.set('fl_last',{goals:j.goals,foods:j.foods,sheetUrl:j.sheetUrl});
  }catch(e){if(seq!==S.seq)return;S.error=e.server?e.message:'offline'}
  S.loading=false;render();
}

// optimistic view = server data + queued jobs
function view(){
  const d=S.data;if(!d)return null;
  let entries=d.entries.map(e=>Object.assign({},e));
  let foods=d.foods.slice();
  for(const j of Q){
    if(j.action==='saveFood'&&j.tmpFood){const i=foods.findIndex(f=>f.id===j.tmpFood.id);if(i>=0)foods[i]=j.tmpFood;else foods.push(j.tmpFood)}
    if(j.action==='hideFood')foods=foods.filter(f=>f.id!==j.id);
    if(j.date&&j.date!==S.date&&j.action==='add')continue;
    if(j.action==='add'&&!entries.some(e=>e.id===j.cid)){const mp=ls.get('fl_idmap',{});const f=foods.find(f=>f.id===j.foodId||f.id===mp[j.foodId]);if(f){const k=j.qty/f.per;entries.push({id:j.cid,date:j.date,meal:j.meal,foodId:f.id,food:f.name,qty:j.qty,unit:f.label,kcal:f.kcal*k,fat:f.fat*k,protein:f.protein*k,net:f.net*k,pending:true})}}
    if(j.action==='edit'){const e=entries.find(e=>e.id===j.id);if(e){if(j.meal)e.meal=j.meal;if(j.qty){const k=j.qty/e.qty;['kcal','fat','protein','net'].forEach(m=>e[m]*=k);e.qty=j.qty}e.pending=true}}
    if(j.action==='del')entries=entries.filter(e=>e.id!==j.id);
  }
  let goals=d.goals;for(const j of Q)if(j.action==='saveGoals'&&j.date<=S.date)goals={kcal:j.kcal,protein:j.protein,fat:j.fat,net:j.net};
  return {goals,foods,entries,sheetUrl:d.sheetUrl};
}

// ---------- queue ----------
function applyLocal(j,res){
  const d=S.data;if(!d)return;
  if(j.action==='saveFood'&&res.food){const i=d.foods.findIndex(f=>f.id===res.food.id);if(i>=0)d.foods[i]=res.food;else d.foods.push(res.food)}
  if(j.action==='hideFood')d.foods=d.foods.filter(f=>f.id!==j.id);
  if(j.action==='add'&&res.entry&&res.entry.date===S.date&&!d.entries.some(e=>e.id===res.entry.id))d.entries.push(res.entry);
  if(j.action==='del')d.entries=d.entries.filter(e=>e.id!==j.id);
  if(j.action==='edit'){const e=d.entries.find(e=>e.id===j.id);if(e){if(j.meal)e.meal=j.meal;if(j.qty){const k=j.qty/e.qty;['kcal','fat','protein','net'].forEach(m=>e[m]*=k);e.qty=j.qty}}}
  if(j.action==='saveGoals'&&res.goals&&j.date<=S.date)d.goals=res.goals;
}
let flushing=false;
function submit(job){job.qid=Date.now()+Math.random();Q.push(job);saveQ();render();flush()}
async function flush(){
  if(flushing||!Q.length||!CFG)return;flushing=true;let changed=false;
  try{
    while(Q.length){
      const j=Q[0];
      const mp=ls.get('fl_idmap',{});
      if(j.foodId&&mp[j.foodId])j.foodId=mp[j.foodId];
      if(j.food&&j.food.id&&mp[j.food.id])j.food.id=mp[j.food.id];
      if(j.action==='hideFood'&&mp[j.id])j.id=mp[j.id];
      const body=Object.assign({},j);delete body.qid;delete body.tmpFood;delete body.held;
      try{
        const res=await api(body);
        if(j.action==='saveFood'&&j.tmpFood&&res.food&&j.tmpFood.id!==res.food.id){
          // a new food got its real id: re-point queued adds
          Q.forEach(x=>{if(x.foodId===j.tmpFood.id)x.foodId=res.food.id});
          const mp=ls.get('fl_idmap',{});mp[j.tmpFood.id]=res.food.id;ls.set('fl_idmap',mp);
        }
        applyLocal(j,res);Q.shift();saveQ();changed=true;
      }catch(e){
        if(e.server){Q.shift();saveQ();toast("Didn't save: "+e.message);changed=true;continue}
        break; // offline: try later
      }
    }
  }finally{flushing=false}
  if(changed)load(true);else render();
}
setInterval(flush,30000);
addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(S.date!==today()&&S.wasToday){S.date=today()}flush();load(true)}});

// ---------- render ----------
function totals(entries){const t={kcal:0,fat:0,protein:0,net:0};entries.forEach(e=>{t.kcal+=e.kcal;t.fat+=e.fat;t.protein+=e.protein;t.net+=e.net});return t}
function render(){
  const app=$('#app');
  if(!CFG){app.innerHTML='<div class="setup"><h2>Food Log</h2><p>Open the setup link once to connect this phone to your sheet.</p></div>';return}
  S.wasToday=S.date===today();
  const v=view();
  const isToday=S.date===today();
  let h=`<header><button class="iconbtn" aria-label="Previous day" onclick="go(-1)">‹</button><h1>${isToday?'Today':nice(S.date)}<span class="sub">${isToday?nice(S.date):(S.date===shift(today(),-1)?'Yesterday':'')}</span></h1><button class="iconbtn" aria-label="Next day" onclick="go(1)" ${isToday?'disabled':''}>›</button><button class="iconbtn" aria-label="Settings" onclick="openSettings()">⚙</button></header>`;
  if(Q.length)h+=`<div class="banner">${Q.length} change${Q.length>1?'s':''} waiting to send<button onclick="flush()">Send now</button></div>`;
  if(S.error&&S.error!=='offline')h+=`<div class="banner err">Sheet error: ${esc(S.error)}<button onclick="load()">Try again</button></div>`;
  else if(S.error==='offline'&&!Q.length)h+=`<div class="banner">No signal, showing saved copy<button onclick="load()">Retry</button></div>`;
  if(!v){app.innerHTML=h+`<div class="card"><div class="empty">${S.loading?'Loading…':'Nothing loaded yet.'}</div></div>`;return}
  const t=totals(v.entries),g=v.goals||{};
  h+='<div class="card bars">';
  for(const [k,label,u,col] of MACROS){
    const goal=g[k]||0,val=t[k],pct=goal?Math.min(100,val/goal*100):0,over=goal&&val>goal;
    const rem=goal-val;
    h+=`<div class="bar ${over?'over':''}"><div class="top"><span>${label}</span><span><b>${fmtG(val)}</b> / ${fmtG(goal)} ${u}</span></div><div class="track"><div class="fill" style="width:${pct}%;background:${over&&k==='net'?'var(--bad)':col}"></div></div><div class="left">${goal?(over?fmtG(-rem)+' '+u+' over':fmtG(rem)+' '+u+' left'):'No goal set'}</div></div>`;
  }
  h+='</div>';
  for(const [m,label] of MEALS){
    const es=v.entries.filter(e=>e.meal===m);const mt=totals(es);
    h+=`<div class="card meal"><h2>${label}<span class="tot">${es.length?r0(mt.kcal)+' kcal · '+fmtG(mt.net)+' g net':''}</span></h2>`;
    if(!es.length)h+='<div class="empty">Nothing yet</div>';
    for(const e of es)h+=`<button class="ent frow ${e.pending?'pending':''}" style="border-bottom:0" onclick="openEntry('${esc(e.id)}')"><div class="n"><div>${esc(e.food)}</div><small>${fmtG(e.qty)} ${esc(e.unit)}</small></div><div class="m"><b>${r0(e.kcal)}</b> kcal<br>${fmtG(e.net)} g net</div></button>`;
    h+=`<button class="addbtn" onclick="openAdd('${m}')">+ Add to ${label.toLowerCase()}</button></div>`;
  }
  app.innerHTML=h;
}
function go(n){const d=shift(S.date,n);if(d>today())return;S.date=d;load()}

// ---------- sheets ----------
function openSheet(html){$('#sheet').innerHTML=html;document.body.classList.add('open');$('#layer').classList.add('open')}
function closeSheet(){$('#layer').classList.remove('open');document.body.classList.remove('open')}
$('#scrim').onclick=closeSheet;

let AD={meal:'lunch',q:''};
function sortedFoods(){const v=view();return v.foods.slice().sort((a,b)=>(b.uses-a.uses)||a.name.localeCompare(b.name))}
function perText(f){return f.unit==='serving'?'per '+f.label:'per 100 '+f.unit}
function openAdd(meal){
  AD={meal:meal||mealNow(),q:''};
  openSheet(`<div class="sh-head"><h3>Add to ${MEALS.find(x=>x[0]===AD.meal)[1].toLowerCase()}</h3><button class="link" onclick="openFoodForm()">+ New food</button><button class="iconbtn" aria-label="Close" onclick="closeSheet()">✕</button></div><div class="sh-body"><input class="search" id="q" placeholder="Search your foods" autocomplete="off" oninput="AD.q=this.value;listFoods()"><div id="flist"></div></div>`);
  listFoods();
}
function listFoods(){
  const words=AD.q.toLowerCase().split(/\s+/).filter(Boolean);
  const fs=sortedFoods().filter(f=>words.every(w=>f.name.toLowerCase().includes(w)));
  $('#flist').innerHTML=fs.length?fs.map(f=>`<button class="frow" onclick="openAmount('${esc(f.id)}')"><div class="n">${esc(f.name)}<small>${perText(f)}</small></div><div class="k">${r0(f.kcal)} kcal · ${fmtG(f.net)} net</div></button>`).join(''):`<div class="empty" style="padding:16px 0">No match. <button class="link" onclick="openFoodForm(null,AD.q)">Create "${esc(AD.q)}"</button></div>`;
}

let AM=null;
function openAmount(foodId,entryId){
  const v=view();
  const e=entryId?v.entries.find(x=>x.id===entryId):null;
  const f=v.foods.find(x=>x.id===(e?e.foodId:foodId));
  if(!f&&!e){toast('Food not found');return}
  AM={f,e,meal:e?e.meal:AD.meal,qty:e?r1(e.qty):(f.defQty||(f.unit==='serving'?1:100))};
  const unit=e?e.unit:f.label;
  const step=(f&&f.unit==='serving')||(e&&!f)?1:(unit==='ml'?5:5);
  openSheet(`<div class="sh-head"><h3 style="font-size:16px">${esc(e?e.food:f.name)}</h3><button class="iconbtn" aria-label="Close" onclick="closeSheet()">✕</button></div><div class="sh-body">
  ${f?`<div class="sub2">${perText(f)}: ${r0(f.kcal)} kcal · F ${fmtG(f.fat)} · P ${fmtG(f.protein)} · net ${fmtG(f.net)} g</div>`:''}
  <div class="qty"><button class="step" onclick="bump(-${step})">−</button><input id="qty" type="number" inputmode="decimal" step="any" value="${AM.qty}" oninput="AM.qty=parseFloat(this.value)||0;amMacros()"><span>${esc(unit)}</span><button class="step" onclick="bump(${step})">+</button></div>
  <div class="macros" id="amm"></div>
  <div class="chips">${MEALS.map(([m,l])=>`<button class="chip ${m===AM.meal?'on':''}" onclick="AM.meal='${m}';document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m==='${m}'))" data-m="${m}">${l}</button>`).join('')}</div>
  <button class="primary" id="amgo" onclick="amSave()">${e?'Save':'Add'}</button>
  ${e?`<button class="secondary danger" onclick="amDelete()">Delete entry</button>`:`<button class="secondary" onclick="openAdd(AM.meal)">Back to list</button>`}
  ${f&&!e?`<div style="display:flex;gap:16px;justify-content:center;margin-top:6px"><button class="link" onclick="openFoodForm('${esc(f.id)}')">Edit food</button><button class="link danger" onclick="hideFood('${esc(f.id)}')">Remove from list</button></div>`:''}
  </div>`);
  amMacros();
  const q=$('#qty');if(!e){q.focus();q.select()}
}
function bump(n){AM.qty=Math.max(0,r1((AM.qty||0)+n));$('#qty').value=AM.qty;amMacros()}
function amMacros(){
  let m;
  if(AM.e){const k=AM.qty/(AM.e.qty||1);m={kcal:AM.e.kcal*k,fat:AM.e.fat*k,protein:AM.e.protein*k,net:AM.e.net*k}}
  else{const k=AM.qty/AM.f.per;m={kcal:AM.f.kcal*k,fat:AM.f.fat*k,protein:AM.f.protein*k,net:AM.f.net*k}}
  $('#amm').innerHTML=`<div><b>${r0(m.kcal)}</b><small>kcal</small></div><div><b>${fmtG(m.net)}</b><small>net carbs</small></div><div><b>${fmtG(m.protein)}</b><small>protein</small></div><div><b>${fmtG(m.fat)}</b><small>fat</small></div>`;
  $('#amgo').disabled=!(AM.qty>0);
}
function amSave(){
  if(!(AM.qty>0))return;
  if(AM.e){const job={action:'edit',id:AM.e.id};if(AM.qty!==r1(AM.e.qty))job.qty=AM.qty;if(AM.meal!==AM.e.meal)job.meal=AM.meal;closeSheet();if(job.qty||job.meal)submit(job);return}
  const cid='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  submit({action:'add',cid,date:S.date,meal:AM.meal,foodId:AM.f.id,qty:AM.qty});
  closeSheet();toast(`Added ${AM.f.name.length>26?AM.f.name.slice(0,26)+'…':AM.f.name}`,'Add more',()=>openAdd(AM.meal));
}
function amDelete(){const e=AM.e;closeSheet();submit({action:'del',id:e.id});toast('Deleted '+e.food.slice(0,28),'Undo',()=>{const i=Q.findIndex(j=>j.action==='del'&&j.id===e.id);if(i>=0){Q.splice(i,1);saveQ();render()}else{submit({action:'add',cid:'e'+Date.now().toString(36),date:e.date||S.date,meal:e.meal,foodId:e.foodId,qty:e.qty})}})}
function openEntry(id){openAmount(null,id)}

// ---------- food form ----------
function openFoodForm(id,name){
  const v=view();const f=id?v.foods.find(x=>x.id===id):null;
  const x=f||{name:name||'',unit:'g',label:'serving',kcal:'',fat:'',protein:'',net:'',defQty:''};
  openSheet(`<div class="sh-head"><h3>${f?'Edit food':'New food'}</h3><button class="iconbtn" aria-label="Close" onclick="closeSheet()">✕</button></div><div class="sh-body form">
  <label>Name</label><input class="inp" id="ff_name" value="${esc(x.name)}" placeholder="e.g. Tesco smoked mackerel">
  <label>Values are per</label><div class="chips" style="margin:0">${[['g','100 g'],['ml','100 ml'],['serving','1 serving']].map(([u,l])=>`<button class="chip ${x.unit===u?'on':''}" data-u="${u}" onclick="ffUnit('${u}')">${l}</button>`).join('')}</div>
  <div id="ff_lab" style="display:${x.unit==='serving'?'block':'none'}"><label>Serving name</label><input class="inp" id="ff_label" value="${esc(x.unit==='serving'?x.label:'serving')}" placeholder="e.g. egg, bar, burger"></div>
  <div class="grid2"><div><label>Calories (kcal)</label><input class="inp" id="ff_kcal" inputmode="decimal" value="${x.kcal}"></div><div><label>Net carbs (g)</label><input class="inp" id="ff_net" inputmode="decimal" value="${x.net}"></div>
  <div><label>Protein (g)</label><input class="inp" id="ff_protein" inputmode="decimal" value="${x.protein}"></div><div><label>Fat (g)</label><input class="inp" id="ff_fat" inputmode="decimal" value="${x.fat}"></div></div>
  <div class="hint">UK labels: net carbs = the "Carbohydrate" line (it already excludes fibre).</div>
  <label>Usual amount</label><input class="inp" id="ff_def" inputmode="decimal" value="${x.defQty}" placeholder="optional">
  <div style="height:14px"></div><button class="primary" onclick="ffSave('${f?esc(f.id):''}')">${f?'Save changes':'Save food'}</button>
  ${f?'<div class="hint" style="text-align:center">Changing a food doesn\'t change entries already logged.</div>':''}
  </div>`);
  FF={unit:x.unit};
  if(!f)$('#ff_name').focus();
}
let FF={unit:'g'};
function ffUnit(u){FF.unit=u;document.querySelectorAll('[data-u]').forEach(c=>c.classList.toggle('on',c.dataset.u===u));$('#ff_lab').style.display=u==='serving'?'block':'none'}
function ffSave(id){
  const val=k=>{const s=$('#ff_'+k).value.trim().replace(',','.');return s===''?null:Number(s)};
  const name=$('#ff_name').value.trim();
  const food={name,unit:FF.unit,label:FF.unit==='serving'?($('#ff_label').value.trim()||'serving'):FF.unit,kcal:val('kcal'),fat:val('fat'),protein:val('protein'),net:val('net'),defQty:val('def')};
  if(!name){toast('Give it a name');return}
  for(const k of ['kcal','fat','protein','net'])if(food[k]==null||!(food[k]>=0)){toast('Fill in calories, net carbs, protein and fat');return}
  food.per=food.unit==='serving'?1:100;
  if(!food.defQty)food.defQty=food.unit==='serving'?1:100;
  const tmp=Object.assign({id:id||('tmp'+Date.now().toString(36)),uses:0},food);
  submit({action:'saveFood',food:id?Object.assign({id},food):food,tmpFood:tmp});
  toast(id?'Food updated':'Food saved');
  if(id)closeSheet();else openAmount(tmp.id);
}
function hideFood(id){const f=view().foods.find(x=>x.id===id);closeSheet();submit({action:'hideFood',id});toast('Removed '+(f?f.name.slice(0,30):'food')+' (still in the sheet)')}

// ---------- settings ----------
function openSettings(){
  const v=view();const g=(v&&v.goals)||{};
  openSheet(`<div class="sh-head"><h3>Goals</h3><button class="iconbtn" aria-label="Close" onclick="closeSheet()">✕</button></div><div class="sh-body form">
  <div class="grid2"><div><label>Calories (kcal)</label><input class="inp" id="g_kcal" inputmode="decimal" value="${g.kcal??''}"></div><div><label>Net carbs (g)</label><input class="inp" id="g_net" inputmode="decimal" value="${g.net??''}"></div>
  <div><label>Protein (g)</label><input class="inp" id="g_protein" inputmode="decimal" value="${g.protein??''}"></div><div><label>Fat (g)</label><input class="inp" id="g_fat" inputmode="decimal" value="${g.fat??''}"></div></div>
  <div class="hint">New goals apply from today on; past days keep the goals they had.</div>
  <div style="height:14px"></div><button class="primary" onclick="saveGoals()">Save goals</button>
  ${v&&v.sheetUrl?`<a class="secondary" style="display:block;text-align:center;text-decoration:none" href="${esc(v.sheetUrl)}" target="_blank" rel="noopener">Open the sheet (export from there)</a>`:''}
  <div class="hint" style="text-align:center;margin-top:14px">Food Log v${APP_VERSION}</div></div>`);
}
function saveGoals(){
  const n=k=>Number($('#g_'+k).value.trim().replace(',','.'));
  const job={action:'saveGoals',date:today(),kcal:n('kcal'),protein:n('protein'),fat:n('fat'),net:n('net')};
  if(['kcal','protein','fat','net'].some(k=>!(job[k]>=0))){toast('Fill in all four');return}
  closeSheet();submit(job);toast('Goals saved');
}

// ---------- toast ----------
let tt;
function toast(msg,act,fn){const t=$('#toast');clearTimeout(tt);t.innerHTML=esc(msg)+(act?` <button id="tact">${esc(act)}</button>`:'');t.style.display='flex';if(act)$('#tact').onclick=()=>{t.style.display='none';fn()};tt=setTimeout(()=>t.style.display='none',act?6000:2500)}

// ---------- start ----------
render();
if(CFG){load();flush()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
