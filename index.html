<script>/* colour theme before first paint, so it never flashes the wrong colours */
// any colour from the wheel: pick readable text for it, and keep buttons visible on light or dark cards
window.flVars=function(hex,dark){
  var n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  var L=.2126*c[0]+.7152*c[1]+.0722*c[2],white=1.05/(L+.05)>=(L+.05)/.06;
  var acc=hex;if(!dark&&L>.72)acc='#111114';if(dark&&L<.035)acc='#F1F2F6';
  var a=acc===hex?L:(acc==='#111114'?0:.9),accWhite=1.05/(a+.05)>=(a+.05)/.06;
  return{'--band':hex,'--onband':white?'#FFFFFF':'#111114','--bandbtn':white?'rgba(255,255,255,.16)':'rgba(0,0,0,.08)','--acc':acc,'--onacc':accWhite?'#FFFFFF':'#111114'};
};
(function(){var t={};try{t=JSON.parse(localStorage.getItem('fl_theme'))||{}}catch(e){}
var d=document.documentElement,m=t.mode||'light',band=t.band||'ink';if(m==='auto')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
d.dataset.mode=m;d.dataset.band=band;
if(band==='custom'&&/^#[0-9a-f]{6}$/i.test(t.custom||'')){var v=flVars(t.custom,m==='dark');for(var k in v)d.style.setProperty(k,v[k])}})();</script>
<style>
@font-face{font-family:Jakarta;src:url(jakarta.woff2) format('woff2');font-weight:200 800;font-display:swap}
/* light (default) */
:root{--bg:#F2F2F7;--card:#FFFFFF;--card2:#F0F0F5;--line:#ECECF1;--text:#111114;--dim:#6B6B75;--faint:#86868F;--bad:#E0243A;--warn:#9A5B00;
--kcal:#FF2D55;--net:#FF9500;--pro:#007AFF;--fat:#34C759;--tint:16%;
--band:#17181F;--onband:#FFFFFF;--bandbtn:rgba(255,255,255,.14);--acc:#111114;--onacc:#FFFFFF;--link:#0062D6;
--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);--shadow2:0 6px 24px rgba(0,0,0,.10);--scrim:rgba(0,0,0,.35);
--toastbg:#1C1C22;--toastfg:#FFFFFF;--toastacc:#8AB8FF;--bw:#FFF3DC;--be:#FFE6E9;--bi:#E8F0FF;--bitext:#1D4ED8;
--m-breakfast:#FF9500;--m-lunch:#34C759;--m-dinner:#5856D6;--m-snack:#FF2D55;--kb:0px;color-scheme:light}
[data-mode=dark]{--bg:#0D0E12;--card:#181A21;--card2:#23262F;--line:#262A33;--text:#F1F2F6;--dim:#A3A7B3;--faint:#80848F;--bad:#FF5C6C;--warn:#FFB547;
--kcal:#FF375F;--net:#FF9F0A;--pro:#0A84FF;--fat:#30D158;--tint:24%;
--band:#1E2029;--acc:#F1F2F6;--onacc:#111114;--link:#7FB2FF;--shadow:none;--shadow2:0 6px 24px rgba(0,0,0,.4);--scrim:rgba(0,0,0,.6);
--toastbg:#F1F2F6;--toastfg:#111114;--toastacc:#0057C2;--bw:#2A2210;--be:#2A1216;--bi:#0E1A33;--bitext:#8DB4FF;
--m-breakfast:#FF9F0A;--m-lunch:#30D158;--m-dinner:#5E5CE6;--m-snack:#FF375F;color-scheme:dark}
[data-band=blue]{--band:#2457F5;--acc:#2457F5;--onacc:#FFFFFF}
[data-band=teal]{--band:#0B7F6F;--acc:#0B7F6F;--onacc:#FFFFFF}

[data-band=orange]{--band:#E2581A;--acc:#E2581A;--onacc:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Jakarta,system-ui,sans-serif;font-variant-numeric:tabular-nums}
html,body{overscroll-behavior-y:none} /* no pull-to-refresh: swiping down never reloads the app */

.grab,.sh-head{touch-action:none} /* dragging the top of a sheet is always a swipe-to-close */
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{opacity:.75}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}

header{display:flex;align-items:center;gap:8px;padding:6px 0 14px;color:var(--onband)}

.rl{font-size:12px;font-weight:600}

.row .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);max-height:calc(92dvh - var(--kb));z-index:11;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;border-top:1px solid var(--line);transform:translateY(105%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s .22s}

.open .sheet{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}

.search:focus,.inp:focus,.qty input:focus{border-color:var(--acc)}

.added span{font-size:12px;color:var(--dim);flex:none}
.pill{background:var(--card2);color:var(--text);font-size:13px;font-weight:600;padding:8px 12px;border-radius:18px;white-space:nowrap;flex:none}
.done{background:var(--acc);color:var(--onacc);font-weight:700;padding:10px 16px;border-radius:12px;min-height:44px;flex:none}
.chips{display:flex;gap:8px;margin:12px 0}

.danger{color:var(--bad)}
.link{color:var(--link);font-weight:600;padding:10px 0}
.links{display:flex;gap:20px;justify-content:center;margin-top:6px}
.form label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.seth{font-size:15px;margin:26px 0 10px}
.swatches{display:flex;gap:12px}
.sw{width:44px;height:44px;border-radius:22px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);display:grid;place-items:center}
.sw[aria-checked=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
.swatches{flex-wrap:wrap}
.swc{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cw{position:relative;width:min(240px,70vw);aspect-ratio:1;border-radius:50%;margin:20px auto 14px;touch-action:none;cursor:crosshair;
  background:radial-gradient(closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cwd{position:absolute;inset:0;border-radius:50%;background:#000;pointer-events:none}
.knob{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:14px;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none}
.crow{display:flex;align-items:center;gap:12px}
.crow input{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none}
.crow input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.2);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.chex{font-size:13px;color:var(--dim);font-weight:600;min-width:64px;text-align:right}

@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="layer"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const APP_VERSION='13';
const MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snacks']];
const mealName=m=>((MEALS.find(x=>x[0]===m)||[0,m])[1]).toLowerCase();
// key, label, unit, colour, isCap (a limit to stay under, not a target to reach)
const MACROS=[['kcal','Calories','kcal','var(--kcal)',false],['net','Net carbs','g','var(--net)',true],['protein','Protein','g','var(--pro)',false],['fat','Fat','g','var(--fat)',false]];
const MKEYS=['kcal','fat','protein','net'];
const $=s=>document.querySelector(s);
const svg=(d,n)=>`<svg aria-hidden="true" width="${n||20}" height="${n||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={left:svg('<path d="M15 6l-6 6 6 6"/>'),right:svg('<path d="M9 6l6 6-6 6"/>'),x:svg('<path d="M6 6l12 12M18 6L6 18"/>',18),plus:svg('<path d="M12 5v14M5 12h14"/>'),
  gear:svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>')};
const MI={breakfast:svg('<path d="M4 18h16M7 18a5 5 0 0 1 10 0M12 9V6M5.6 11.6 4.2 10.2M18.4 11.6l1.4-1.4"/>',22),
  lunch:svg('<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',22),
  dinner:svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',22),
  snack:svg('<circle cx="12" cy="12" r="8.5"/><path d="M9 9h.01M14.5 8.5h.01M9.5 14.5h.01M15 13.5h.01M12 11.5h.01" stroke-width="3"/>',22)};
const tint=c=>`color-mix(in srgb,${c} var(--tint),transparent)`; // a ring's empty track: a faint wash of its own colour
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100, r0=n=>Math.round(n);
const fmt=n=>{n=r1(n);return (Math.abs(n)>=100?r0(n):n).toLocaleString('en-GB')};
const cut=(s,n)=>s.length>n?s.slice(0,n)+'…':s;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// ---------- config: one-time setup link  #setup=<base64 {url,key}> ----------
(function(){const m=/#setup=([A-Za-z0-9_\-]+)/.exec(location.hash);if(!m)return;try{let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const c=JSON.parse(atob(b));if(c.url&&c.key)ls.set('fl_cfg',c)}catch(e){}history.replaceState(null,'',location.pathname)})();
const CFG=ls.get('fl_cfg',null);
ls.del('fl_cache'); // v1 cache format, no longer used

// ---------- dates (the phone's own clock decides what "today" is) ----------
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return dkey(new Date())}
function shift(k,n){const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function nice(k){const [y,m,d]=k.split('-').map(Number);return DN[new Date(y,m-1,d).getDay()]+' '+d+' '+MN[m-1]}
function mealNow(){const h=new Date().getHours()+new Date().getMinutes()/60;return h<11?'breakfast':h<16.5?'lunch':'dinner'}

// ---------- state ----------
// S.follow: the screen is on "today" and should roll over to the new day at midnight
const S={date:today(),follow:true,data:null,loading:false,error:null,seq:0,badKey:false,update:false,pg:{}};
let Q=ls.get('fl_queue',[]);            // changes not yet confirmed by the sheet
const saveQ=()=>ls.set('fl_queue',Q);
let IDMAP=Q.length?ls.get('fl_idmap',{}):{}; // temp id of a just-created food -> its real id
if(!Q.length)ls.del('fl_idmap');
const realId=id=>IDMAP[id]||id;

const newCid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function apiErr(kind,msg){const e=new Error(msg);e.kind=kind;return e}
async function api(body,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||25000);
  let r;
  try{r=await fetch(CFG.url,{method:'POST',body:JSON.stringify(Object.assign({key:CFG.key},body)),redirect:'follow',signal:ctl.signal})}
  catch(e){throw apiErr('offline','offline')}
  finally{clearTimeout(t)}
  let j;
  try{j=await r.json()}catch(e){throw apiErr('google','Google returned an error page')}
  if(j.error)throw apiErr('server',j.error);
  return j;
}

function cached(date){
  const base=ls.get('fl_last',null);if(!base)return null;
  const day=ls.get('fl_days',{})[date];
  return {date,goals:(day&&day.goals)||base.goals,foods:base.foods,entries:day?day.entries:[],sheetUrl:base.sheetUrl,partial:!day};
}
function remember(j){
  ls.set('fl_last',{goals:j.goals,foods:j.foods,sheetUrl:j.sheetUrl});
  const days=ls.get('fl_days',{});days[j.date]={goals:j.goals,entries:j.entries};
  Object.keys(days).sort().slice(0,-8).forEach(k=>delete days[k]);ls.set('fl_days',days);
}
async function load(quiet){
  if(!CFG)return;
  const seq=++S.seq,date=S.date,w=WRITES;
  if(!S.data||S.data.date!==date)S.data=cached(date);
  S.loading=true;if(!quiet)render();
  try{
    const j=await api({action:'state',date});
    if(seq!==S.seq)return;
    if(w!==WRITES){if(!flushing)load(true);return} // a change landed while this was on its way: it's out of date, ask again
    S.data=j;S.error=null;S.badKey=false;remember(j);
  }catch(e){
    if(seq!==S.seq)return;
    S.error=e.kind==='offline'?'offline':e.message;
    if(e.kind==='server'&&e.message==='Wrong key')S.badKey=true;
  }
  S.loading=false;render();
}

// ---------- one place that knows what each change does to a day's data ----------
function entryFrom(j,f){const k=j.qty/f.per;return{id:j.cid,date:j.date,meal:j.meal,foodId:f.id,food:f.name,qty:j.qty,unit:f.label,kcal:f.kcal*k,fat:f.fat*k,protein:f.protein*k,net:f.net*k}}
function rescale(e,qty){const k=qty/(e.qty||1);MKEYS.forEach(m=>e[m]*=k);e.qty=qty}
function applyJob(d,j,res){
  switch(j.action){
    case 'saveFood':{const f=(res&&res.food)||(j.tmpFood&&Object.assign({},j.tmpFood,{id:realId(j.tmpFood.id)}));if(!f)break;const tmp=j.tmpFood&&j.tmpFood.id;const i=d.foods.findIndex(x=>x.id===f.id||x.id===tmp);if(i>=0)d.foods[i]=f;else d.foods.push(f);break}
    case 'hideFood':{const id=realId(j.id);d.foods=d.foods.filter(f=>f.id!==id);break}
    case 'add':{
      if(j.date!==d.date||d.entries.some(e=>e.id===j.cid))break;
      let e=res&&res.entry;
      if(!e){const id=realId(j.foodId),f=d.foods.find(f=>f.id===id);if(!f)break;e=entryFrom(j,f);e.pending=true}
      d.entries.push(e);break}
    case 'edit':{const e=d.entries.find(e=>e.id===j.id);if(!e)break;if(j.meal)e.meal=j.meal;if(j.qty)rescale(e,j.qty);if(!res)e.pending=true;break}
    case 'del':d.entries=d.entries.filter(e=>e.id!==j.id);break;
    case 'saveGoals':if(j.date<=d.date)d.goals=(res&&res.goals)||{kcal:j.kcal,protein:j.protein,fat:j.fat,net:j.net};break;
  }
}
// what's on screen = what the sheet last told us + everything still waiting to send
function view(){
  const s=S.data;if(!s)return null;
  const d={date:s.date,goals:s.goals,foods:s.foods.slice(),entries:s.entries.map(e=>Object.assign({},e)),sheetUrl:s.sheetUrl};
  for(const j of Q)applyJob(d,j);
  return d;
}

// ---------- send queue ----------
const UNDO_MS=6000; // deletes wait this long before they're sent, so Undo is a true undo
const PERMANENT=/^(Food not found|Bad |Amount must|Food needs|Unknown action)/;
let flushing=false,inFlight=null,retryAt=0,WRITES=0; // WRITES counts changes the sheet has confirmed
function submit(job){job.qid=Date.now()+'-'+Math.random().toString(36).slice(2,8);Q.push(job);saveQ();render();flush(true);if(job.after)setTimeout(()=>flush(true),job.after-Date.now()+50)}
const unsend=job=>{if(inFlight===job.qid||!Q.some(j=>j.qid===job.qid))return false;Q=Q.filter(j=>j.qid!==job.qid);saveQ();render();return true};
async function flush(force){
  if(flushing||!CFG||S.badKey)return;
  if(!force&&Date.now()<retryAt)return;
  flushing=true;let changed=false;
  try{
    for(;;){
      const now=Date.now(),j=Q.find(x=>!x.held&&!(x.after>now));if(!j)break;
      if(j.foodId)j.foodId=realId(j.foodId);
      if(j.food&&j.food.id)j.food.id=realId(j.food.id);
      const body=Object.assign({},j);delete body.qid;delete body.tmpFood;delete body.held;delete body.tries;delete body.after;
      if(j.action==='hideFood')body.id=realId(j.id);
      inFlight=j.qid;
      let res,err;try{res=await api(body)}catch(e){err=e}
      inFlight=null;
      const drop=()=>{Q=Q.filter(x=>x.qid!==j.qid);saveQ();changed=true;WRITES++};
      if(!err){
        if(j.action==='saveFood'&&j.tmpFood&&res.food&&j.tmpFood.id!==res.food.id){IDMAP[j.tmpFood.id]=res.food.id;ls.set('fl_idmap',IDMAP)}
        if(S.data)applyJob(S.data,j,res);
        drop();retryAt=0;continue;
      }
      if(err.kind!=='server'){retryAt=Date.now()+10000;break}       // no signal / Google hiccup: keep everything, try again later
      if(err.message==='Wrong key'){S.badKey=true;break}             // keep everything until the phone is re-linked
      if(/^Entry not found/.test(err.message)){drop();continue}      // editing something already deleted: nothing to do
      j.tries=(j.tries||0)+1;
      if(PERMANENT.test(err.message)||j.tries>=4){j.held=err.message;saveQ();continue} // park it and let the user decide
      saveQ();retryAt=Date.now()+15000;break;                        // e.g. the sheet was busy: retry
    }
  }finally{flushing=false;inFlight=null}
  if(changed&&S.data&&!S.data.partial)remember(S.data); // so a confirmed entry is still there if the next refresh fails
  if(changed)load(true);else render();
}
function retryHeld(){Q.forEach(j=>{delete j.held;delete j.tries});saveQ();flush(true)}
function discardHeld(){Q=Q.filter(j=>!j.held);saveQ();render();load(true)}

// ---------- keeping in step with the clock, the network and new versions ----------
function tick(){
  if(S.follow&&S.date!==today()&&!STACK.length){S.date=today();resetMealPages();load()}
  flush();
}
setInterval(tick,30000);
addEventListener('online',()=>flush(true));
addEventListener('storage',e=>{if(e.key==='fl_queue'&&!flushing){Q=ls.get('fl_queue',[]);render()}}); // another copy of the app changed the queue
let lastSeen=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lastSeen=Date.now();return}
  const away=Date.now()-lastSeen;
  if(!S.follow&&away>30*60000&&!STACK.length){S.follow=true}   // left on an old day for a while: open on today, like any diary app
  const rolled=S.follow&&S.date!==today();
  tick();
  if(!rolled&&away>60000)load(true);
  if(swReg)swReg.update().catch(()=>{});
});

// ---------- main screen ----------
const RING=2*Math.PI*31; // length of a ring's circle
function totals(es){const t={kcal:0,fat:0,protein:0,net:0};es.forEach(e=>MKEYS.forEach(m=>t[m]+=e[m]));return t}
function banners(){
  let h='';
  const now=Date.now(),held=Q.filter(j=>j.held),waiting=Q.filter(j=>!j.held&&!(j.after>now)).length;
  if(S.date!==today())h+=`<div class="banner info"><span>You're on ${nice(S.date)}, not today</span><button data-act="today">Go to today</button></div>`;
  if(S.update)h+=`<div class="banner info"><span>Update ready</span><button data-act="reload">Reload</button></div>`;
  if(S.badKey)h+=`<div class="banner err"><span>This phone is no longer linked to your sheet. Open the setup link again. Nothing you've logged is lost.</span></div>`;
  if(held.length)h+=`<div class="banner err"><span>${held.length} change${held.length>1?'s':''} couldn't be saved (${esc(held[0].held)})</span><button data-act="retryHeld">Retry</button><button data-act="discardHeld">Discard</button></div>`;
  if(waiting&&!S.badKey&&(S.error||!navigator.onLine||retryAt))h+=`<div class="banner"><span>${waiting} change${waiting>1?'s':''} waiting to send</span><button data-act="sendNow">Send now</button></div>`;
  else if(S.error==='offline'&&!waiting)h+=`<div class="banner"><span>${!S.data?'No signal. Connect once so your foods can load.':S.data.partial?"No signal, and this day isn't saved on this phone yet":'No signal, showing the last saved copy'}</span><button data-act="reloadData">Retry</button></div>`;
  if(S.error&&S.error!=='offline'&&!S.badKey)h+=`<div class="banner err"><span>Couldn't read the sheet: ${esc(S.error)}</span><button data-act="reloadData">Try again</button></div>`;
  return h;
}
function render(){
  if((SW.on&&Date.now()-SW.since<5000)||SW.t){SW.pending=true;return} // a stuck touch never blocks for long
  const app=$('#app');
  if(!CFG){app.innerHTML='<div class="setup"><h2>Food Log</h2><p>Open the setup link once to connect this phone to your sheet.</p></div>';return}
  const isToday=S.date===today();
  const v=view(),ready=!!v,first=!v||(S.data.partial&&S.loading); // first = nothing trustworthy for this day yet
  const d=v||{goals:{},entries:[]},g=d.goals||{},t=totals(d.entries),unloaded=ready&&S.data.partial&&!S.loading;
  let h=`<div class="band"></div><header><button class="iconbtn" aria-label="Previous day" data-act="day" data-n="-1">${IC.left}</button><h1>${isToday?'Today':nice(S.date)}<span class="sub">${isToday?nice(S.date):(S.date===shift(today(),-1)?'Yesterday':'')}</span></h1><button class="iconbtn" aria-label="Next day" data-act="day" data-n="1" ${isToday?'disabled':''}>${IC.right}</button><button class="iconbtn" aria-label="Goals and settings" data-act="goals" ${ready?'':'disabled'}>${IC.gear}</button></header>`;
  h+=banners();
  h+='<div class="card mac"><div class="pages" data-sw="top"><div class="pg rings" aria-label="Goals">';
  for(const [k,label,u,col,cap] of MACROS){
    const goal=g[k]||0,val=t[k],frac=goal?Math.min(1,val/goal):0,over=goal&&val>goal+0.05,un=k==='kcal'?'':' g';
    const sub=!ready?'&nbsp;':!goal?'No goal':over?fmt(val-goal)+un+' over':fmt(goal-val)+un+' left';
    const arc=frac>0?`<circle cx="38" cy="38" r="31" fill="none" style="stroke:${over&&cap?'var(--bad)':col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(RING*frac).toFixed(1)} ${RING.toFixed(1)}" transform="rotate(-90 38 38)"/>`:'';
    h+=`<button class="ring" data-act="ring" data-k="${k}" ${ready?'':'disabled'}><div class="dial"><svg width="76" height="76" viewBox="0 0 76 76" role="img" aria-label="${label}: ${ready?fmt(val):'loading'} of ${fmt(goal)} ${u}"><circle cx="38" cy="38" r="31" fill="none" style="stroke:${tint(col)}" stroke-width="8"/>${arc}</svg><b>${ready?fmt(val):'–'}</b></div><div class="rl">${label}</div><div class="rs ${over&&cap?'bad':''}">${sub}</div></button>`;
  }
  h+=`</div><div class="pg" aria-label="Goals chart">${chart(t,g,ready,false)}</div></div>${dots('top',2)}</div>`;
  for(const [m,label] of MEALS){
    const es=d.entries.filter(e=>e.meal===m),mt=totals(es);
    const tot=es.length?r0(mt.kcal)+' kcal, '+fmt(mt.net)+' g net':first?'Loading…':unloaded?'Not loaded':'Nothing yet';
    h+=`<div class="card meal"><div class="mh"><span class="mi" style="background:var(--m-${m})">${MI[m]}</span><h2>${label}<span class="tot">${tot}</span></h2><button class="plus" aria-label="Add to ${label.toLowerCase()}" data-act="add" data-meal="${m}" ${ready?'':'disabled'}>${IC.plus}</button></div>`;
    if(!es.length)delete S.pg['m:'+m];
    if(es.length){
      // swipe the card: what's in it, then the rings chart for this meal, then its macros
      h+=`<div class="pages" data-sw="m:${m}"><div class="pg" aria-label="${label} foods">`;
      for(const e of es)h+=`<button class="row ent ${e.pending?'pending':''}" data-act="entry" data-id="${esc(e.id)}"><div class="n"><div>${esc(e.food)}</div><small>${fmt(e.qty)} ${esc(e.unit)}</small></div><div class="m"><b>${r0(e.kcal)}</b> kcal<br>${fmt(e.net)} g net</div></button>`;
      h+=`</div><div class="pg" aria-label="${label} chart">${chart(mt,g,true,true)}</div><div class="pg" aria-label="${label} macros">${mealMacros(mt,g)}</div></div>${dots('m:'+m,3)}`;
    }
    h+='</div>';
  }
  app.innerHTML=h;
  swipers();
}
// ----- swipeable cards: one swipe = one page; the card's height follows the page you're on -----
const dots=(k,n)=>`<div class="dots" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i===Math.min(S.pg[k]||0,n-1)?'on':''}"></i>`).join('')}</div>`;
let swRO=null;
function swipers(){
  if(swRO)swRO.disconnect();
  swRO=window.ResizeObserver?new ResizeObserver(es=>es.forEach(e=>{const el=e.target.parentNode;if(el&&el._fit)el._fit()})):null;
  $('#app').querySelectorAll('.pages').forEach(el=>{
    const k=el.dataset.sw,pgs=[...el.children],n=pgs.length,ds=el.nextElementSibling.children;
    const pos=()=>Math.max(0,Math.min(n-1,el.scrollLeft/(el.clientWidth||1)));
    el._fit=()=>{const p=pos(),a=Math.floor(p),b=Math.min(n-1,a+1),f=p-a;el.style.height=(pgs[a].offsetHeight*(1-f)+pgs[b].offsetHeight*f)+'px'};
    const i=Math.min(S.pg[k]||0,n-1);
    if(i)el.scrollLeft=i*el.clientWidth;
    el._fit();
    if(swRO)pgs.forEach(p=>swRO.observe(p));
    el.addEventListener('scroll',()=>{
      el._fit();
      const j=Math.round(pos());if(j!==(S.pg[k]||0)){S.pg[k]=j;[...ds].forEach((d,x)=>d.classList.toggle('on',x===j))}
      if(SW.t){clearTimeout(SW.t);SW.t=setTimeout(swDone,250)}
    },{passive:true});
  });
}
// while a finger is on a swipe card (and while it glides to rest), hold back screen rebuilds so the swipe isn't cut off
const SW={on:false,since:0,t:null,pending:false};
setInterval(()=>{if(SW.pending&&!SW.t&&!(SW.on&&Date.now()-SW.since<5000)){SW.on=false;SW.pending=false;render()}},2000);
function swDone(){SW.t=null;if(!SW.on&&SW.pending){SW.pending=false;render()}}
document.addEventListener('touchstart',e=>{if(e.target.closest&&e.target.closest('.pages')){SW.on=true;SW.since=Date.now();clearTimeout(SW.t);SW.t=null}},{passive:true,capture:true});
['touchend','touchcancel'].forEach(t=>document.addEventListener(t,()=>{if(!SW.on)return;SW.on=false;clearTimeout(SW.t);SW.t=setTimeout(swDone,350)},{passive:true,capture:true}));
// Carb Manager style chart, drawn as nested rings (fat outside, protein, net carbs inside) with the numbers beside it
const CH=[['fat','Fat',53,'var(--fat)',false],['protein','Protein',40,'var(--pro)',false],['net','Net carbs',27,'var(--net)',true]];
function chart(t,g,ready,meal){
  let svg='';
  for(const [k,,R,col,cap] of CH){
    const C=2*Math.PI*R,goal=g[k]||0,f=goal?Math.min(1,t[k]/goal):0,over=goal&&t[k]>goal+0.05,c=over&&cap&&!meal?'var(--bad)':col;
    svg+=`<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${tint(col)}" stroke-width="11"/>`;
    if(ready&&f>0)svg+=`<circle cx="60" cy="60" r="${R}" fill="none" style="stroke:${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${Math.max(0.1,C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>`;
  }
  const gk=g.kcal||0;
  let h=`<div class="gc"><svg class="gcw" viewBox="0 0 120 120" aria-hidden="true">${svg}</svg><div class="gside"><div class="gk"><b>${ready?fmt(t.kcal):'–'}</b> ${meal?`kcal<small>${gk?r0(t.kcal/gk*100)+"% of today's calories":''}</small>`:`<span>/ ${gk?fmt(gk):'–'} kcal</span><small>${!ready||!gk?'&nbsp;':t.kcal>gk?fmt(t.kcal-gk)+' over':fmt(gk-t.kcal)+' left'}</small>`}</div>`;
  for(const [k,label,,col,cap] of [CH[2],CH[1],CH[0]]){
    const goal=g[k]||0,over=goal&&t[k]>goal+0.05;
    const side=!ready||!goal?'':meal?r0(t[k]/goal*100)+'%':over?fmt(t[k]-goal)+' g over':fmt(goal-t[k])+' g left';
    const tag=meal?'div':'button';
    h+=`<${tag} class="lg" ${meal?'':`data-act="ring" data-k="${k}"`}><i style="background:${col}"></i><span>${label}<b>${ready?fmt(t[k]):'–'}<small>${meal?' g':' / '+(goal?fmt(goal):'–')+' g'}</small></b></span><em class="${over&&cap&&!meal?'bad':''}">${side}</em></${tag}>`;
  }
  return h+'</div></div>';
}
// a meal's own macros, each with how much of the day's goal it used
function mealMacros(t,g){
  const cell=(k,label,col)=>{const p=g[k]?t[k]/g[k]*100:0;return `<div><b>${k==='kcal'?r0(t[k]):fmt(t[k])}</b><small>${label}</small><i><u style="width:${Math.min(100,p).toFixed(0)}%;background:${col}"></u></i><em>${g[k]?r0(p)+'% of day':''}</em></div>`};
  return `<div class="mm4">${cell('kcal','kcal','var(--kcal)')}${cell('net','net carbs','var(--net)')}${cell('protein','protein','var(--pro)')}${cell('fat','fat','var(--fat)')}</div>`;
}
const goToday=()=>{if(S.date!==today())resetMealPages();S.date=today();S.follow=true;load()};
function go(n){const d=shift(S.date,n);if(d>today())return;S.date=d;S.follow=d===today();resetMealPages();load()}
function resetMealPages(){Object.keys(S.pg).forEach(k=>{if(k.startsWith('m:'))delete S.pg[k]})}

// ---------- bottom sheets: each open sheet is a step the Back button undoes ----------
const STACK=[];
const layer=$('#layer'),sheetEl=$('#sheet');
function nav(fn){STACK.push(fn);history.pushState({sheet:STACK.length},'');fn();layer.classList.add('open');document.documentElement.classList.add('sheet-open')}
function navReplace(fn){STACK[STACK.length-1]=fn;fn()}
function hideLayer(){layer.classList.remove('open');document.documentElement.classList.remove('sheet-open');if(document.activeElement)document.activeElement.blur()}
function closeAll(){const n=STACK.length;if(!n)return;STACK.length=0;hideLayer();history.go(-n)}
function back(){if(STACK.length)history.back()}
const leave=()=>STACK.length>1?back():closeAll(); // finished with this sheet: back to the food list if that's where we came from
addEventListener('popstate',()=>{if(!STACK.length)return;STACK.pop();if(STACK.length)STACK[STACK.length-1]();else hideLayer()});
$('#scrim').addEventListener('click',closeAll);
const head=(title,extra)=>`<div class="grab"></div><div class="sh-head"><h3>${title}</h3>${extra||''}<button class="iconbtn" aria-label="Close" data-act="close">${IC.x}</button></div>`;
// swipe down to dismiss (from the header, or from the content when it's scrolled to the top)
(function(){let y0=null,dy=0,t0=0;
  sheetEl.addEventListener('touchstart',e=>{const b=sheetEl.querySelector('.sh-body'),inHead=!e.target.closest('.sh-body');
    if(!inHead&&(b.scrollTop>0||e.target.closest('input,.nodrag')))return void(y0=null);
    y0=e.touches[0].clientY;dy=0;t0=Date.now()},{passive:true});
  sheetEl.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){if(e.cancelable)e.preventDefault();sheetEl.style.transition='none';sheetEl.style.transform='translateY('+dy+'px)'}},{passive:false});
  const end=()=>{if(y0==null)return;sheetEl.style.transition='';sheetEl.style.transform='';const fast=dy/Math.max(1,Date.now()-t0)>0.5;if(dy>120||(fast&&dy>40))back();y0=null};
  sheetEl.addEventListener('touchend',end);sheetEl.addEventListener('touchcancel',end);
})();
// if the browser doesn't shrink the page for the keyboard, lift the sheet above it ourselves
let lastW=innerWidth;addEventListener('resize',()=>{if(innerWidth!==lastW){lastW=innerWidth;render()}}); // card heights depend on the width
if(window.visualViewport){const vv=visualViewport,f=()=>{const kb=innerHeight-vv.height-vv.offsetTop;document.documentElement.style.setProperty('--kb',(kb>120?kb:0)+'px')};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}

// ----- add: pick a food -----
let AD={meal:'lunch',q:'',added:[]}; // added = what's been logged since this list was opened
function perText(f){return f.unit==='serving'?'per '+f.label:'per 100 '+f.unit}
const usualQty=f=>f.defQty||(f.unit==='serving'?1:100);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); // so "espanola" finds "Española"
function openAdd(meal){AD={meal:meal||mealNow(),q:'',added:[]};nav(sheetAdd)}
function sheetAdd(){
  sheetEl.innerHTML=`<div class="grab"></div><div class="sh-head"><h3>Add to ${mealName(AD.meal)}${S.date===today()?'':' · '+nice(S.date)}</h3><button class="link" data-act="newFood">New food</button><button class="done" data-act="done">Done</button></div><div class="sh-body"><input class="search" id="q" placeholder="Search your foods" autocomplete="off" enterkeyhint="search" value="${esc(AD.q)}"><div id="added"></div><div id="flist"></div></div>`;
  $('#q').addEventListener('input',e=>{AD.q=e.target.value;listFoods()});
  listFoods();
}
// foods logged at this meal on 2+ of the days this phone remembers (about the last week)
function usualAt(meal){
  const n={},days=ls.get('fl_days',{});
  Object.keys(days).forEach(k=>{const seen={};(days[k].entries||[]).forEach(e=>{if(e.meal===meal&&!seen[e.foodId]){seen[e.foodId]=1;n[e.foodId]=(n[e.foodId]||0)+1}})});
  return n;
}
function listFoods(){
  if(!$('#flist'))return;
  const v=view(),words=norm(AD.q).split(/\s+/).filter(Boolean);
  const fs=v.foods.filter(f=>{const n=norm(f.name);return words.every(w=>n.includes(w))}).sort((a,b)=>(b.uses-a.uses)||a.name.localeCompare(b.name));
  const row=f=>{const q=usualQty(f),k=q/f.per;return `<div class="row frow"><button class="n" data-act="pick" data-id="${esc(f.id)}"><div>${esc(f.name)}</div><small>${fmt(q)} ${esc(f.label)} · ${r0(f.kcal*k)} kcal · ${fmt(f.net*k)} g net</small></button><button class="plus" aria-label="Add ${fmt(q)} ${esc(f.label)} of ${esc(f.name)}" data-act="quick" data-id="${esc(f.id)}">${IC.plus}</button></div>`};
  const mine=v.entries.filter(e=>AD.added.includes(e.id));
  $('#added').innerHTML=mine.length?`<div class="added"><span>Added</span>${mine.map(e=>`<button class="pill" data-act="entry" data-id="${esc(e.id)}">${esc(cut(e.food,18))} · ${fmt(e.qty)} ${esc(e.unit)}</button>`).join('')}</div>`:'';
  let usual=[];
  if(!words.length){const n=usualAt(AD.meal),here=new Set(v.entries.filter(e=>e.meal===AD.meal).map(e=>e.foodId));
    usual=fs.filter(f=>n[f.id]>=2&&!here.has(f.id)).sort((a,b)=>n[b.id]-n[a.id]).slice(0,3)}
  const rest=fs.filter(f=>!usual.includes(f));
  $('#flist').innerHTML=!fs.length?`<div class="empty" style="padding:16px 0">No match. <button class="link" data-act="newFood">Create "${esc(AD.q)}"</button></div>`
    :(usual.length?`<div class="sec">Usual for ${mealName(AD.meal)}</div>${usual.map(row).join('')}<div class="sec">All foods, most used first</div>`:'')+rest.map(row).join('');
}
// one tap: log the usual amount and stay in the list
function logFood(f,qty,meal){
  const cid=newCid();AD.added.push(cid);
  submit({action:'add',cid,date:S.date,meal,foodId:f.id,qty});
  if(navigator.vibrate)navigator.vibrate(8);
  toast('Added '+fmt(qty)+' '+f.label+' · '+cut(f.name,20),'Undo',()=>undoAdd(cid));
}
let lastQuick=[null,0];
function quick(id){
  if(lastQuick[0]===id&&Date.now()-lastQuick[1]<600)return; // an accidental double tap shouldn't log it twice
  lastQuick=[id,Date.now()];
  const f=view().foods.find(x=>x.id===id);if(!f)return;
  logFood(f,usualQty(f),AD.meal);
  if(AD.q){AD.q='';$('#q').value=''}
  listFoods();
}
function undoAdd(cid){
  AD.added=AD.added.filter(x=>x!==cid);
  const job=Q.find(j=>j.action==='add'&&j.cid===cid);
  if(!(job&&unsend(job)))submit({action:'del',id:cid}); // already on its way to the sheet: remove it there
  listFoods();
}

// ----- amount: add a food, or change an entry -----
let AM=null;
function pick(id){const f=view().foods.find(x=>x.id===id);if(!f)return;AM={fid:id,eid:null,meal:AD.meal,qty:f.defQty||(f.unit==='serving'?1:100),fresh:true};nav(sheetAmount)}
function openEntry(id){const e=view().entries.find(x=>x.id===id);if(!e)return;AM={fid:e.foodId,eid:id,meal:e.meal,qty:r2(e.qty),was:r2(e.qty)};nav(sheetAmount)}
function amParts(){const v=view(),e=AM.eid?v.entries.find(x=>x.id===AM.eid):null,fid=realId(AM.fid),f=v.foods.find(x=>x.id===fid);return{e,f}}
function sheetAmount(){
  const {e,f}=amParts();
  if(!e&&!f){sheetEl.innerHTML=head('Not found')+'<div class="sh-body"><div class="empty">That item is no longer there.</div></div>';return}
  const unit=e?e.unit:f.label;
  sheetEl.innerHTML=head(esc(e?e.food:f.name))+`<div class="sh-body">
  ${f?`<div class="hint">${perText(f)}: ${r0(f.kcal)} kcal · fat ${fmt(f.fat)} · protein ${fmt(f.protein)} · net ${fmt(f.net)} g</div>`:''}
  <div class="qty"><button class="step" aria-label="1 ${esc(unit)} less" data-n="-1">−</button><input id="qty" type="number" inputmode="decimal" step="any" min="0" enterkeyhint="done" aria-label="Amount" value="${AM.qty}"><span>${esc(unit)}</span><button class="step" aria-label="1 ${esc(unit)} more" data-n="1">+</button></div>
  <div class="macros" id="amm"></div>
  <div class="chips four">${MEALS.map(([m,l])=>`<button class="chip ${m===AM.meal?'on':''}" data-act="meal" data-m="${m}">${l}</button>`).join('')}</div>
  <button class="primary" id="amgo" data-act="amSave">${e?'Save':'Add'}</button>
  ${e?`<button class="secondary danger" data-act="amDelete">Delete entry</button>`
     :`<div class="links"><button class="link" data-act="editFood">Edit food</button><button class="link danger" data-act="hideFood">Remove from list</button></div>`}
  </div>`;
  const q=$('#qty');
  q.addEventListener('input',()=>{AM.qty=parseFloat(q.value)||0;amMacros()});
  q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();amSave()}});
  sheetEl.querySelectorAll('.step').forEach(holdStep);
  amMacros();
  if(AM.fresh){AM.fresh=false;q.focus();q.select()}
}
function amMacros(){
  const {e,f}=amParts();let m;
  if(e){const k=AM.qty/(e.qty||1);m={kcal:e.kcal*k,fat:e.fat*k,protein:e.protein*k,net:e.net*k}}
  else if(f){const k=AM.qty/f.per;m={kcal:f.kcal*k,fat:f.fat*k,protein:f.protein*k,net:f.net*k}}
  else return;
  $('#amm').innerHTML=`<div><b>${r0(m.kcal)}</b><small>kcal</small></div><div><b>${fmt(m.net)}</b><small>net carbs</small></div><div><b>${fmt(m.protein)}</b><small>protein</small></div><div><b>${fmt(m.fat)}</b><small>fat</small></div>`;
  $('#amgo').disabled=!(AM.qty>0);
}
function bump(n){AM.qty=Math.max(0,r2((AM.qty||0)+n));$('#qty').value=AM.qty;amMacros()}
// tap = 1 unit; hold = keeps going, faster the longer it's held
function holdStep(b){
  const n=Number(b.dataset.n);let t=null,count=0;
  const stop=()=>{clearTimeout(t);t=null};
  const loop=()=>{bump(n);count++;t=setTimeout(loop,count<8?110:count<30?55:25)};
  b.addEventListener('pointerdown',ev=>{if(ev.button)return;ev.preventDefault();stop();count=0;bump(n);if(navigator.vibrate)try{navigator.vibrate(5)}catch(e){};t=setTimeout(loop,420)});
  ['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,stop));
  b.addEventListener('contextmenu',ev=>ev.preventDefault());
  b.addEventListener('click',ev=>{if(ev.detail===0)bump(n)}); // keyboard Enter/Space
}
function amSave(){
  if(!(AM.qty>0))return;
  const {e,f}=amParts();
  if(AM.eid){
    if(!e)return leave();
    const job={action:'edit',id:e.id};
    if(AM.qty!==AM.was)job.qty=AM.qty;
    if(AM.meal!==e.meal)job.meal=AM.meal;
    if(job.qty||job.meal)submit(job);
    return leave();
  }
  if(!f)return leave();
  logFood(f,AM.qty,AM.meal);AD.q='';
  leave();
}
function amDelete(){
  const {e}=amParts();leave();if(!e)return;
  AD.added=AD.added.filter(x=>x!==e.id);
  // not sent yet? then just cancel it rather than sending an add followed by a delete
  const mine=j=>(j.action==='add'&&j.cid===e.id)||(j.action==='edit'&&j.id===e.id);
  const unsentAdd=Q.find(j=>j.action==='add'&&j.cid===e.id&&j.qid!==inFlight);
  let undo;
  if(unsentAdd&&!Q.some(j=>mine(j)&&j.qid===inFlight)){
    const removed=Q.filter(mine);Q=Q.filter(j=>!mine(j));saveQ();render();
    undo=()=>{removed.forEach(j=>{delete j.held;delete j.tries;Q.push(j)});saveQ();render();flush(true)};
  }else{
    const job={action:'del',id:e.id,after:Date.now()+UNDO_MS};submit(job);
    undo=()=>{if(!unsend(job))submit({action:'add',cid:newCid(),date:e.date||S.date,meal:e.meal,foodId:e.foodId,qty:e.qty})}; // already gone from the sheet: log it again
  }
  toast('Deleted '+cut(e.food,26),'Undo',undo);
}

// ---------- colour theme (stored on this phone only) ----------
const BANDS=[['ink','Ink','#17181F'],['blue','Blue','#2457F5'],['teal','Teal','#0B7F6F'],['violet','Violet','#6D4AFF'],['orange','Orange','#E2581A']];
let TH=Object.assign({band:'ink',mode:'light'},ls.get('fl_theme',{}));
const okHex=h=>/^#[0-9a-f]{6}$/i.test(h||'');
if(!(BANDS.some(b=>b[0]===TH.band)||(TH.band==='custom'&&okHex(TH.custom))))TH.band='ink';
if(!['light','dark','auto'].includes(TH.mode))TH.mode='light';
const darkQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const d=document.documentElement;d.dataset.band=TH.band;d.dataset.mode=TH.mode==='auto'?(darkQ.matches?'dark':'light'):TH.mode;
  const v=TH.band==='custom'?flVars(TH.custom,d.dataset.mode==='dark'):{};
  ['--band','--onband','--bandbtn','--acc','--onacc'].forEach(k=>v[k]?d.style.setProperty(k,v[k]):d.style.removeProperty(k));
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(d).getPropertyValue('--band').trim()||'#17181F'; // phone status bar matches the header
}
function setTheme(ch){
  if(ch.band==='custom'&&!okHex(TH.custom)&&!ch.custom)ch.custom=(BANDS.find(b=>b[0]===TH.band)||BANDS[1])[2]; // start the wheel on the colour you had
  Object.assign(TH,ch);ls.set('fl_theme',TH);applyTheme();
  sheetEl.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-checked',b.dataset.b===TH.band));
  const w=$('#cwp');if(w){if(TH.band==='custom'){if(!w.childElementCount)wheel(w)}else w.innerHTML=''}
  sheetEl.querySelectorAll('[data-act=mode]').forEach(b=>{const on=b.dataset.m===TH.mode;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
}
darkQ.addEventListener&&darkQ.addEventListener('change',()=>{if(TH.mode==='auto')applyTheme()});
// ----- colour wheel: round = which colour and how strong, slider = how dark -----
const hsv2hex=(h,s,v)=>{const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
function hex2hsv(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return{h,s:mx?d/mx:0,v:mx}}
function wheel(box){
  const c=hex2hsv(TH.custom);
  box.innerHTML=`<div class="cw nodrag" id="cw" role="slider" aria-label="Colour wheel" tabindex="0"><div class="cwd" id="cwd"></div><i class="knob" id="knob"></i></div>
  <div class="crow nodrag"><input type="range" id="cv" min="15" max="100" aria-label="How dark"><span class="chex" id="chex"></span></div>`;
  const cw=$('#cw'),cv=$('#cv');cv.value=Math.round(c.v*100);
  let raf=0;
  const show=save=>{
    const R=cw.clientWidth/2,a=c.h*Math.PI/180;
    $('#knob').style.transform=`translate(${(R+Math.sin(a)*c.s*R).toFixed(1)}px,${(R-Math.cos(a)*c.s*R).toFixed(1)}px)`;
    $('#cwd').style.opacity=(1-c.v).toFixed(2);
    const hex=hsv2hex(c.h,c.s,c.v);$('#knob').style.background=hex;$('#chex').textContent=hex;
    cv.style.background=`linear-gradient(to right,#000,${hsv2hex(c.h,c.s,1)})`;cw.setAttribute('aria-valuetext',hex);
    if(save){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>setTheme({band:'custom',custom:hex}))}
  };
  const at=e=>{const r=cw.getBoundingClientRect(),R=r.width/2,dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;
    c.h=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;c.s=Math.min(1,Math.hypot(dx,dy)/R);if(c.v<.15)c.v=.6,cv.value=60;show(true)};
  let down=false;
  cw.addEventListener('pointerdown',e=>{down=true;cw.setPointerCapture(e.pointerId);at(e)});
  cw.addEventListener('pointermove',e=>{if(down)at(e)});
  ['pointerup','pointercancel'].forEach(t=>cw.addEventListener(t,()=>down=false));
  cw.addEventListener('keydown',e=>{const k={ArrowLeft:-10,ArrowRight:10}[e.key];if(k){e.preventDefault();c.h=(c.h+k+360)%360;if(c.s<.2)c.s=.8;show(true)}});
  cv.addEventListener('input',()=>{c.v=cv.value/100;show(true)});
  show(false);
}
applyTheme();

// ---------- every tap goes through here ----------
const ACT={
  day:d=>go(Number(d.n)),today:goToday,goals:()=>nav(sheetGoals),add:d=>openAdd(d.meal),entry:d=>openEntry(d.id),
  ring:d=>{RG={k:d.k};nav(sheetRing)},ringK:d=>{RG.k=d.k;sheetRing()},
  close:back,done:closeAll,quick:d=>quick(d.id),newFood:()=>openFoodForm(null,AD.q),pick:d=>pick(d.id),
meal:d=>{AM.meal=d.m;sheetEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.m===d.m))},
  amSave,amDelete,editFood:()=>openFoodForm(realId(AM.fid)),hideFood,
  ffUnit:d=>ffUnit(d.u),ffSave,saveGoals,band:d=>setTheme({band:d.b}),mode:d=>setTheme({mode:d.m}),
  retryHeld,discardHeld,sendNow:()=>flush(true),reloadData:()=>load(),reload:()=>location.reload(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn)fn(el.dataset,el)});

// ---------- toast ----------
let toastTimer;
function toast(msg,act,fn){const t=$('#toast');clearTimeout(toastTimer);t.innerHTML=esc(msg)+(act?` <button id="tact">${esc(act)}</button>`:'');t.style.display='flex';if(act)$('#tact').onclick=()=>{t.style.display='none';fn()};toastTimer=setTimeout(()=>t.style.display='none',act?6000:2500)}

// ---------- start ----------
let swReg=null;
render();
if(CFG){load();flush(true)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{}); // ask Chrome not to clear unsent entries when storage is tight
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){S.update=true;render()}});
  navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{});
}
</script>
</body>
</html>
